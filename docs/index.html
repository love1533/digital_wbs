/* ── Password Gate ── */

.gate-sub{font-size:.82rem;color:#64748b;margin-bottom:2rem}
.gate-input{width:100%;padding:.8rem 1.1rem;border:2px solid #e2e8f0;border-radius:.6rem;font-size:.95rem;color:#1e293b;outline:none;transition:border .2s,box-shadow .2s;margin-bottom:1rem}
.gate-input:focus{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.gate-btn{width:100%;padding:.8rem;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:.6rem;font-size:.95rem;font-weight:600;cursor:pointer;transition:opacity .2s;letter-spacing:.01em}
.gate-btn:hover{opacity:.9}
.gate-err{font-size:.75rem;color:#ef4444;margin-top:.65rem;min-height:1.1rem}
.gate-hint{font-size:.68rem;color:#93c5fd;margin-top:.75rem}

/* ── App Shell ── */
#main{display:none}
.app-header{background:#1e293b;color:#fff;padding:.85rem 1.5rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.35)}
.app-header h1{font-size:.98rem;font-weight:700;flex:1;min-width:0}
.hbadge{font-size:.63rem;padding:.18rem .55rem;border-radius:99px;font-weight:600;white-space:nowrap}
.hb-blue{background:#1d4ed8;color:#bfdbfe}.hb-green{background:#166534;color:#bbf7d0}.hb-amber{background:#92400e;color:#fde68a}
.sync{font-size:.67rem;color:#94a3b8;display:flex;align-items:center;gap:.3rem;margin-left:auto;white-space:nowrap}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:blink 2s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── Stats ── */
.stats-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:0;background:#fff;border-bottom:2px solid #e2e8f0}
@media(max-width:680px){.stats-strip{grid-template-columns:repeat(3,1fr)}}
.stat{text-align:center;padding:.7rem .5rem;border-right:1px solid #f1f5f9}
.stat:last-child{border-right:none}
.stat-val{font-size:1.5rem;font-weight:800;line-height:1}
.stat-lbl{font-size:.58rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.07em;margin-top:.2rem}

/* ── Progress ── */
.prog-strip{padding:.55rem 1.5rem;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:.85rem}
.prog-bar{flex:1;height:8px;background:#f1f5f9;border-radius:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#1d4ed8,#0ea5e9);transition:width .6s ease}
.prog-pct{font-size:.75rem;font-weight:800;color:#1d4ed8;min-width:3rem;text-align:right}
.prog-label{font-size:.7rem;color:#64748b;white-space:nowrap}

.toolbar{padding:.55rem 1.5rem;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:.38rem;flex-wrap:wrap}
.tbtn{padding:.3rem .68rem;border:1.5px solid #e2e8f0;border-radius:.35rem;font-size:.7rem;font-weight:500;cursor:pointer;background:#fff;color:#64748b;transition:all .15s;white-space:nowrap}
.tbtn:hover{border-color:#2563eb;color:#2563eb;background:#eff6ff}
.tbtn.on{background:#2563eb;border-color:#2563eb;color:#fff}

.legend{display:flex;align-items:center;gap:.55rem;margin-left:auto;flex-wrap:wrap}

.leg-bar{width:14px;height:8px;border-radius:2px;flex-shrink:0}

const HASH = "3e4df03324f19acc8efdb00a9f162cb279a64e06dc662ac5fcd6d17ca5917b83";
async function sha256(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function auth(){
  const v=document.getElementById('pw').value;
  if(!v){err('비밀번호를 입력해주세요');return;}
  if(await sha256(v)===HASH){
    sessionStorage.setItem('wbs','1');
    show();
  } else {
    err('비밀번호가 올바르지 않습니다');
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
  }
}
function err(m){const e=document.getElementById('err');e.textContent=m;setTimeout(()=>e.textContent='',2500)}

  document.getElementById('gate').style.display='none';

  {id:'1.5.3',n:'보안 취약점 점검',         t:'t',area:'사이버',s:24, e:25, st:'todo'},
  {id:'1.5.4',n:'사용자 인수 테스트 (UAT)',t:'t',area:'PMO',  s:25, e:26, st:'todo'},
  {id:'1.5.5',n:'데이터 마이그레이션 시험이관',t:'t',area:'이지원',s:25,e:26,st:'todo'},
  {id:'M4',   n:'구현단계 감리 (3단계)',   t:'m',area:'PMO',  s:26, e:26, st:'todo'},
  // ─ P6 완료 ─────────────────────────────────────────────
  {id:'P6',   n:'안정화 및 완료',          t:'p',area:'PMO',  s:27, e:28, st:'todo'},
  {id:'1.6.1',n:'운영 환경 최종 구성',     t:'t',area:'인프라',s:27, e:27, st:'todo'},
  {id:'1.6.2',n:'데이터 본이관',           t:'t',area:'이지원',s:27, e:27, st:'todo'},
  {id:'M5',   n:'시스템 오픈 (Go-Live)',   t:'m',area:'PMO',  s:27, e:27, st:'todo'},
  {id:'1.6.3',n:'사용자 교육',             t:'t',area:'PMO',  s:27, e:28, st:'todo'},
  {id:'1.6.4',n:'운영 매뉴얼 작성',         t:'t',area:'PMO',  s:27, e:28, st:'todo'},
  {id:'1.6.5',n:'안정화 운영 지원',         t:'t',area:'PMO',  s:27, e:28, st:'todo'},
  {id:'1.6.6',n:'최종 산출물 정리',         t:'t',area:'PMO',  s:28, e:28, st:'todo'},
  {id:'M6',   n:'완료보고',                 t:'m',area:'PMO',  s:28, e:28, st:'todo'},
];

// ── 상태 관리 ────────────────────────────────────────────────
const pOpen={};
D.filter(r=>r.t==='p').forEach(r=>pOpen[r.id]=true);
let flt='all';

// ── 통계 ─────────────────────────────────────────────────────
function stats(){
  const ts=D.filter(r=>r.t==='t');
  const tot=ts.length, dn=ts.filter(x=>x.st==='done').length,
        dg=ts.filter(x=>x.st==='doing').length, td=ts.filter(x=>x.st==='todo'||x.st==='review').length;
  const p=tot?Math.round(dn/tot*100):0;
  document.getElementById('s-total').textContent=tot;
  document.getElementById('s-done').textContent=dn;
  document.getElementById('s-doing').textContent=dg;
  document.getElementById('s-todo').textContent=td;
  document.getElementById('pfill').style.width=p+'%';
  document.getElementById('ppct').textContent=p+'%';
  document.getElementById('h-done').textContent=dn+' 완료';
  document.getElementById('h-pct').textContent=p+'%';
}

// ── 간트 렌더 ────────────────────────────────────────────────
function render(){
  const tbl=document.getElementById('gtbl');
  tbl.innerHTML='';

  // HEAD
  const thead=tbl.createTHead();
  // 행1: 고정열 + 월 헤더
  const hr1=thead.insertRow();
  hr1.innerHTML=`<th class="th-id" rowspan="2">ID</th><th class="th-name" rowspan="2">작업명 / Task Name</th>`;
  MONTHS.forEach(m=>{
    const c=m.e-m.s+1;
    const th=document.createElement('th');
    th.className='th-month'; th.colSpan=c;
    th.textContent='2026년 '+m.n;
    hr1.appendChild(th);
  });
  // 행2: 주차 헤더
  const hr2=thead.insertRow();
  for(let w=1;w<=TW;w++){
    const th=document.createElement('th');
    th.className='th-w'+(w===TODAY_W?' th-w-now':'');
    th.textContent='W'+w;
    hr2.appendChild(th);
  }

  // BODY
  const tbody=tbl.createTBody();
  let curP=null;

  D.forEach(row=>{
    if(row.t==='p') curP=row.id;
    // 필터: 태스크만 적용, 마일스톤/Phase는 항상 표시
    if(flt!=='all' && row.t==='t' && row.st!==flt) return;
    const isChild=(row.t==='t'||row.t==='m');
    const hide=isChild && curP && !pOpen[curP];

    const tr=tbody.insertRow();
    tr.className='r-'+{p:'phase',t:'task',m:'milestone'}[row.t]+(hide?' hidden':'');
    if(isChild) tr.dataset.ph=curP;

    // ─ ID cell ─
    const tdId=tr.insertCell(); tdId.className='td-id';
    if(row.t==='p'){
      const chv=document.createElement('span');
      chv.className='chv'+(pOpen[row.id]?' o':'');
      chv.textContent='▶';
      chv.onclick=()=>togP(row.id);
      tdId.appendChild(chv);
      tdId.appendChild(document.createTextNode(' '+row.id));
      tdId.style.color='#475569'; tdId.style.fontWeight='700';
    } else {
      tdId.innerHTML=`<span style="color:#e2e8f0">└</span> ${row.id}`;
    }

    // ─ Name cell ─
    const tdN=tr.insertCell(); tdN.className='td-name';
    const c=AC[row.area]||'#94a3b8';
    const wrap=document.createElement('div'); wrap.className='row-label';
    const pip=document.createElement('div'); pip.className='area-pip';

    if(row.t==='m'){
      pip.style.background='#fbbf24'; pip.style.borderRadius='2px';
      wrap.appendChild(pip);
      const sp=document.createElement('span');
      sp.style.cssText='color:#b45309;font-weight:700;font-size:.78rem';
      sp.textContent='◆ '+row.n.replace('◆ ','');
      wrap.appendChild(sp);
    } else if(row.t==='p'){
      pip.style.background=c;
      wrap.appendChild(pip);
      const sp=document.createElement('span');
      sp.className='row-text'; sp.style.cssText='font-weight:700;font-size:.8rem;color:#1e293b';
      sp.textContent=row.n;
      wrap.appendChild(sp);
      // task count
      const kids=D.filter(r=>{
        let cp=null;
        for(const x of D){if(x.t==='p')cp=x.id;if(x===r)break;}
        return r.t==='t'&&cp===row.id;
      });
    } else {
      pip.style.background=c;
      wrap.appendChild(pip);
      const sp=document.createElement('span');
      sp.className='row-text'; sp.style.color=c; sp.textContent=row.n;
      wrap.appendChild(sp);
      if(row.st){
        const bd=document.createElement('span');
        bd.className='sbadge '+SC[row.st];
        bd.textContent=SL[row.st];
        wrap.appendChild(bd);
      }
    }
    tdN.appendChild(wrap);

    // ─ Week cells ─
    for(let w=1;w<=TW;w++){
      const td=tr.insertCell();
      td.className='td-week'+(w===TODAY_W?' w-now':'');

      if(row.t==='m'){
        // 마일스톤
        if(w===row.s){
          td.className+=' ms';
          td.textContent='◆';
          td.title=row.n+' (W'+row.s+')';
        }
      } else if(w>=row.s && w<=row.e){
        const isS=(w===row.s), isE=(w===row.e), isSE=(row.s===row.e);
        const isPhase=(row.t==='p');
        const div=document.createElement('div');
        let cls=isPhase?'bar bar-phase':'bar';
        if(isSE) cls+=' bar-se';
        else if(isS) cls+=' bar-s';
        else if(isE) cls+=' bar-e';
        div.className=cls;
        div.style.background=c;
        if(!isPhase && row.st==='done') div.classList.add('bar-done');
        td.appendChild(div);
        if(isS){
          td.title=`${row.id}: ${row.n}\nW${row.s}~W${row.e} (${row.e-row.s+1}주) | ${row.area} | ${SL[row.st]||''}`;
          td.style.cursor='help';
        }
      }
    }
  });
}

// ── 컨트롤 ──────────────────────────────────────────────────
function togP(pid){
  pOpen[pid]=!pOpen[pid];
  document.querySelectorAll(`[data-ph="${pid}"]`).forEach(tr=>tr.classList.toggle('hidden',!pOpen[pid]));
  const chv=document.querySelector(`.r-phase .chv[onclick*="${pid}"]`);
  // re-query by iterating
  document.querySelectorAll('.r-phase .chv').forEach(el=>{
    if(el.onclick && el.onclick.toString().includes(pid)) el.classList.toggle('o',pOpen[pid]);
  });
  render(); // simpler to re-render
}
function setF(f,btn){
  flt=f;
  ['all','todo','doing','review','done'].forEach(x=>document.getElementById('f-'+x)?.classList.toggle('on',x===f));
  render();
}
function expAll(){D.filter(r=>r.t==='p').forEach(r=>pOpen[r.id]=true);render()}
function colAll(){D.filter(r=>r.t==='p').forEach(r=>pOpen[r.id]=false);render()}

function init(){stats();render()}
</script>
</body>
</html>
