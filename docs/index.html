.gb-footer{font-size:.65rem;color:#94a3b8;margin-top:1rem;display:flex;align-items:center;justify-content:center;gap:.3rem}

/* ── 메인 레이아웃 ── */

.pb-main{display:flex;align-items:center;gap:1rem;flex:1;min-width:200px}
.pb-pct{font-size:2.6rem;font-weight:900;color:#38bdf8;line-height:1;min-width:5rem;letter-spacing:-.04em}
.pb-info{flex:1;display:flex;flex-direction:column;gap:.25rem}
.pb-label{font-size:.62rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.pb-bar{height:10px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;margin:.25rem 0}
.pb-fill{height:100%;background:linear-gradient(90deg,#22c55e,#38bdf8,#6366f1);border-radius:5px;transition:width .8s cubic-bezier(.4,0,.2,1)}

/* ── 통계 스트립 ── */

/* 바디 셀 */

<script>
// ═══ 인증 ══════════════════════════════════════════════════
const HASH = "3e4df03324f19acc8efdb00a9f162cb279a64e06dc662ac5fcd6d17ca5917b83";
async function sha256(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function auth(){
  const v=document.getElementById('pw').value;
  if(!v){setErr('비밀번호를 입력해주세요');return;}
  if(await sha256(v)===HASH){
    sessionStorage.setItem('wbs','1');
    open_main();
  } else {
    setErr('비밀번호가 올바르지 않습니다');
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
  }
}
function setErr(m){const e=document.getElementById('gerr');e.textContent=m;setTimeout(()=>e.textContent='',2500)}
function open_main(){
  document.getElementById('gate').style.display='none';
  document.getElementById('main').style.display='block';
  init();
}

else document.getElementById('pw').focus();

function calcStats(){
  const ts=D.filter(r=>r.t==='t');
  const tot=ts.length, dn=ts.filter(x=>x.st==='done').length,
        dg=ts.filter(x=>x.st==='doing').length,
        rv=ts.filter(x=>x.st==='review').length,
        td=ts.filter(x=>x.st==='todo').length;
  const pct=tot?Math.round(dn/tot*100):0;

  document.getElementById('s-t').textContent=tot;
  document.getElementById('s-d').textContent=dn;
  document.getElementById('s-g').textContent=dg;
  document.getElementById('s-r').textContent=rv;
  document.getElementById('s-n').textContent=td;
  document.getElementById('pb-pct').textContent=pct+'%';
  document.getElementById('pb-fill').style.width=pct+'%';
  document.getElementById('h-done').textContent=dn+'/'+tot+' 완료';
  document.getElementById('h-pct').textContent=pct+'%';
  document.getElementById('pb-detail').innerHTML=
    `<span class="pb-stat"><span class="pbs-dot" style="background:#22c55e"></span>완료 ${dn}</span>`+
    `<span class="pb-stat"><span class="pbs-dot" style="background:#38bdf8"></span>진행 ${dg}</span>`+
    `<span class="pb-stat"><span class="pbs-dot" style="background:#fbbf24"></span>검토 ${rv}</span>`+
    `<span class="pb-stat"><span class="pbs-dot" style="background:#e2e8f0"></span>대기 ${td}</span>`;

  // 6영역 카드
  const AREAS=['이지원','사이버','콜센터','인프라','PMO'];
  const areaLabels={이지원:'이지원 시스템',사이버:'사이버보안',콜센터:'콜센터',인프라:'공통 인프라',PMO:'PMO'};
  const cardsEl=document.getElementById('area-cards');
  cardsEl.innerHTML='';
  AREAS.forEach(area=>{
    const atasks=ts.filter(r=>r.area===area);
    const adn=atasks.filter(r=>r.st==='done').length;
    const adg=atasks.filter(r=>r.st==='doing').length;
    const ap=atasks.length?Math.round(adn/atasks.length*100):0;
    const col=AC[area]||'#64748b';
    const bg=ACbg[area]||'#f8fafc';
    const tc=ACtext[area]||'#475569';
    const card=document.createElement('div');
    card.className='ac'+(curArea===area?' active':'');
    card.style.cssText=`background:${bg};color:${tc}`;
    card.onclick=()=>setA(curArea===area?'all':area, null);
    card.innerHTML=`
      <div class="ac-label">${areaLabels[area]||area}</div>
      <div class="ac-pct" style="color:${col}">${ap}%</div>
      <div class="ac-counts">${adn}/${atasks.length} 완료 · 진행 ${adg}</div>
      <div class="ac-bar"><div class="ac-fill" style="width:${ap}%;background:${col}"></div></div>
    `;
    cardsEl.appendChild(card);
  });
}

function getWRange(){
  const f=parseInt(document.getElementById('wfrom')?.value||1);
  const t=parseInt(document.getElementById('wto')?.value||TW);
  return{from:f,to:t};
}
function resetWRange(){
  document.getElementById('wfrom').value=1;
  document.getElementById('wto').value=TW;
  render();
}

function render(){
  calcStats();
  const tbl=document.getElementById('gtbl');
  tbl.innerHTML='';
  const{from,to}=getWRange();
  const colCount=to-from+1;
  const thead=tbl.createTHead();

  // 헤더 행1: 월
  const hr1=thead.insertRow();
  hr1.innerHTML=`<th class="th-id" rowspan="2">ID</th><th class="th-nm" rowspan="2">작업명 / Task Name</th><th class="th-ow" rowspan="2">담당</th>`;
  MONTHS.forEach(m=>{
    const vis_s=Math.max(m.s,from), vis_e=Math.min(m.e,to);
    if(vis_s>vis_e) return;
    const th=document.createElement('th');
    th.className='th-mo'; th.colSpan=vis_e-vis_s+1;
    th.textContent='2026년 '+m.n;
    hr1.appendChild(th);
  });

  // 헤더 행2: 주차
  const hr2=thead.insertRow();
  for(let w=from;w<=to;w++){
    const d=weekStartDate(w);
    const th=document.createElement('th');
    const de=new Date(d.getTime()+6*86400000);
    const eSuffix=d.getMonth()===de.getMonth()?`${de.getDate()}`:`${de.getMonth()+1}/${de.getDate()}`;
    th.className='th-w'+(w===TODAY_W?' th-w-now':w<TODAY_W?' th-w-past':'');
    th.innerHTML=`<div class="th-w-num">W${w}</div><div class="th-w-dt">${fmtDate(d)}~${eSuffix}</div>`;
    th.title=`W${w}: ${fmtDate(d)} ~ ${fmtDate(de)}`;
    th.id='wh'+w;
    hr2.appendChild(th);
  }

  // 바디
  const tbody=tbl.createTBody();
  let curP=null;
  D.forEach(row=>{
    if(row.t==='p') curP=row.id;
    // 영역 필터
    if(curArea!=='all'&&row.t==='t'&&row.area!==curArea) return;
    if(curArea!=='all'&&row.t==='m') return;
    // 상태 필터
    if(flt!=='all'&&row.t==='t'&&row.st!==flt) return;
    if(flt!=='all'&&row.t==='m') return;
    // 날짜 필터: task가 이 기간과 겹치는지
    if(row.t==='t'&&(row.e<from||row.s>to)) return;
    if(row.t==='m'&&(row.s<from||row.s>to)) return;

    const isChild=row.t==='t'||row.t==='m';
    const hide=isChild&&curP&&!pOpen[curP];
    const tr=tbody.insertRow();
    tr.className='r-'+{p:'phase',t:'task',m:'ms'}[row.t]+(hide?' hidden':'');
    if(isChild) tr.dataset.ph=curP;

    // ID 셀
    const tdi=tr.insertCell(); tdi.className='td-id';
    const shortId=row.jiraKey?'#'+row.jiraKey.split('-').pop():row.id;
    if(row.t==='p'){
      const cv=document.createElement('span');
      cv.className='chv'+(pOpen[row.id]?' o':'');
      cv.textContent='▶'; cv.onclick=()=>togP(row.id);
      tdi.appendChild(cv);
      if(row.jiraKey&&row.jiraUrl){
        const a=document.createElement('a');
        a.href=row.jiraUrl; a.target='_blank'; a.className='jkey';
        a.style.cssText='color:#475569;font-weight:700;margin-left:.2rem';
        a.textContent=shortId; a.onclick=e=>e.stopPropagation();
        tdi.appendChild(a);
      } else {
        tdi.appendChild(document.createTextNode(' '+shortId));
      }
      tdi.style.cssText='color:#475569;font-weight:700';
    } else {
      tdi.innerHTML=`<span style="color:#e2e8f0">└</span> `;
      if(row.jiraKey&&row.jiraUrl){
        const a=document.createElement('a');
        a.href=row.jiraUrl; a.target='_blank'; a.className='jkey';
        a.textContent=shortId; a.onclick=e=>e.stopPropagation();
        tdi.appendChild(a);
      } else {
        tdi.appendChild(document.createTextNode(shortId));
      }
    }

    // Name 셀
    const tdn=tr.insertCell(); tdn.className='td-nm';
    const c=AC[row.area]||'#94a3b8';
    const rl=document.createElement('div'); rl.className='rl';
    const pip=document.createElement('div'); pip.className='rpip';
    if(row.t==='m'){
      pip.style.cssText='background:#fbbf24;border-radius:2px';
      rl.appendChild(pip);
      const sp=document.createElement('span');
      sp.style.cssText='color:#b45309;font-weight:700;font-size:.76rem';
      sp.textContent='◆ '+row.n.replace('◆ ','');
      rl.appendChild(sp);
    } else {
      pip.style.background=c;
      rl.appendChild(pip);
      const sp=document.createElement('span'); sp.className='rtxt';
      if(row.t==='p') sp.style.cssText='font-weight:700;font-size:.79rem;color:#1e293b';
      else sp.style.color='#334155';
      sp.textContent=row.n;
      rl.appendChild(sp);
      if(row.jiraKey&&row.jiraUrl){
        const a=document.createElement('a');
        a.className='jkey'; a.href=row.jiraUrl; a.target='_blank';
        a.textContent=row.jiraKey; a.title='JIRA에서 열기';
        a.onclick=e=>e.stopPropagation();
        rl.appendChild(a);
      }
      if(row.t==='t'){
        const bd=document.createElement('span');

    const tdow=tr.insertCell(); tdow.className='td-ow';
    if(row.owner){
      const chip=document.createElement('span');
      chip.className='owner-chip';
      chip.style.cssText=`background:${ownerColor(row.area)};color:${ownerTextColor(row.area)}`;
      chip.textContent=row.owner;
      chip.title=row.owner;
      tdow.appendChild(chip);
    }

    // 주차 셀
    for(let w=from;w<=to;w++){
      const td=tr.insertCell();
      const isPast=w<TODAY_W, isNow=w===TODAY_W;
      td.className='td-w'+(isNow?' col-now':isPast?' col-past':'');

      if(row.t==='m'){
        if(w===row.s){td.className+=' ms-cell';td.textContent='◆';td.title=`◆ ${row.n}\n${fmtDate(weekStartDate(w))}`;}
      } else if(w>=row.s&&w<=row.e){
        const isSE=row.s===row.e, isS=w===row.s, isE=w===row.e;
        const isP=row.t==='p';
        const div=document.createElement('div');
        let cls=isP?'bph':'bar';
        if(isSE) cls+=' bar-se';
        else if(isS) cls+=' bar-s';
        else if(isE) cls+=' bar-e';
        div.className=cls;
        div.style.background=c;
        if(!isP&&row.st==='done') div.classList.add('bar-done');
        td.appendChild(div);
        if(isS){
          const sd=weekStartDate(row.s), ed=new Date(weekStartDate(row.e));
          ed.setDate(ed.getDate()+6);
          td.title=`${row.id}: ${row.n}\n담당: ${row.owner||'-'}\n기간: ${fmtDate(sd)} ~ ${fmtDate(ed)} (${row.e-row.s+1}주)\n영역: ${row.area} | 상태: ${SL[row.st]||''}`;
          td.style.cursor='help';
        }
      }
    }
  });
  requestAnimationFrame(updateLayout);
}

// ═══ 컨트롤 ════════════════════════════════════════════════
function togP(pid){
  pOpen[pid]=!pOpen[pid];
  document.querySelectorAll(`[data-ph="${pid}"]`).forEach(tr=>tr.classList.toggle('hidden',!pOpen[pid]));
  const chv=document.querySelector(`.chv`);
  render();
}
function setF(f,btn){
  flt=f;
  ['all','todo','doing','review','done'].forEach(x=>document.getElementById('f-'+x)?.classList.toggle('on',x===f));
  render();
}
function setA(a,btn){
  curArea=a;
  ['all','이지원','사이버','콜센터','인프라','PMO'].forEach(x=>{
    document.getElementById('fa-'+x)?.classList.toggle('on',x===a);
  });
  render();
}
function expAll(){D.filter(r=>r.t==='p').forEach(r=>pOpen[r.id]=true);render();}
function colAll(){D.filter(r=>r.t==='p').forEach(r=>pOpen[r.id]=false);render();}

function renderReset(){render();document.getElementById('gscroll').scrollLeft=0;}

// ═══ 레이아웃 (sticky + 반응형) ════════════════════════════
function updateLayout(){
  const hdrEl=document.querySelector('.app-hdr');
  const tbEl=document.querySelector('.toolbar');
  const dnEl=document.querySelector('.date-nav');
  const gs=document.getElementById('gscroll');
  if(!hdrEl||!tbEl||!dnEl||!gs) return;
  const hdrH=hdrEl.offsetHeight;
  const tbH=tbEl.offsetHeight;
  const dnH=dnEl.offsetHeight;
  // toolbar / date-nav sticky top
  tbEl.style.top=hdrH+'px';
  dnEl.style.top=(hdrH+tbH)+'px';
  // gantt-scroll 높이: 뷰포트 - (hdr+toolbar+datenav)
  const total=hdrH+tbH+dnH;
  gs.style.height='calc(100vh - '+total+'px)';
  gs.style.minHeight='300px';
  // 주차 헤더(row2) sticky top = row1 높이
  const row1El=document.querySelector('.gtbl thead tr');
  if(row1El){
    const row1H=Math.ceil(row1El.getBoundingClientRect().height)||28;
    document.querySelectorAll('.th-w').forEach(th=>th.style.top=row1H+'px');
  }
}
window.addEventListener('resize',updateLayout);

function goToday(){jumpToWeek(Math.max(1,TODAY_W||1));}
function jumpToWeek(w){
  w=parseInt(w); if(!w) return;
  const sc=document.getElementById('gscroll');
  const{from}=getWRange();
  const offset=(w-from)*52-100;
  sc.scrollTo({left:Math.max(0,offset),behavior:'smooth'});
  document.getElementById('weekSel').value=w;
}

// ─ Excel 내보내기 ─
function exportExcel(){
  if(typeof XLSX==='undefined'){alert('SheetJS 로딩 중입니다. 잠시 후 다시 시도해주세요.');return;}
  const wb=XLSX.utils.book_new();

  // Sheet 1: WBS 전체
  const h1=['ID','구분','작업명','업무영역','담당자','상태','시작주','종료주','기간(주)','시작일','종료일'];
  const rows=D.map(r=>{
    const sd=weekStartDate(r.s), ed=new Date(weekStartDate(r.e));
    ed.setDate(ed.getDate()+6);
    return[r.id,{p:'Phase',t:'Task',m:'Milestone'}[r.t],r.n,r.area,r.owner||'',SL[r.st]||r.st,r.s,r.e,r.e-r.s+1,fmtDateFull(sd),fmtDateFull(ed)];
  });
  const ws1=XLSX.utils.aoa_to_sheet([h1,...rows]);
  ws1['!cols']=[{wch:10},{wch:10},{wch:40},{wch:10},{wch:12},{wch:8},{wch:7},{wch:7},{wch:8},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws1,'WBS 전체');

  // Sheet 2: Phase별 진척
  const h2=['Phase','Phase명','전체','완료','진행중','검토중','대기','진척률(%)'];
  let cp=null; const pm={};
  D.forEach(r=>{
    if(r.t==='p'){cp=r.id;pm[r.id]={ph:r,kids:[]};}
    else if(r.t==='t'&&cp) pm[cp].kids.push(r);
  });
  const pr2=Object.values(pm).map(({ph,kids})=>{
    const tot=kids.length,dn=kids.filter(k=>k.st==='done').length,
          dg=kids.filter(k=>k.st==='doing').length,rv=kids.filter(k=>k.st==='review').length,
          td=kids.filter(k=>k.st==='todo').length;
    return[ph.id,ph.n,tot,dn,dg,rv,td,tot?Math.round(dn/tot*100):0];
  });
  const ws2=XLSX.utils.aoa_to_sheet([h2,...pr2]);
  ws2['!cols']=[{wch:8},{wch:20},{wch:8},{wch:6},{wch:8},{wch:6},{wch:6},{wch:8}];
  XLSX.utils.book_append_sheet(wb,ws2,'Phase 진척');

  // Sheet 3: 담당자별
  const h3=['담당자','소속영역','담당 Task수','완료','진행중','대기','진척률(%)'];
  const ownerMap={};
  D.filter(r=>r.t==='t').forEach(r=>{
    const k=r.owner||'미지정';
    if(!ownerMap[k]) ownerMap[k]={owner:k,area:r.area,tasks:[]};
    ownerMap[k].tasks.push(r);
  });
  const pr3=Object.values(ownerMap).map(({owner,area,tasks})=>{
    const tot=tasks.length,dn=tasks.filter(k=>k.st==='done').length,
          dg=tasks.filter(k=>k.st==='doing').length,td=tasks.filter(k=>k.st==='todo').length;
    return[owner,area,tot,dn,dg,td,tot?Math.round(dn/tot*100):0];
  });
  const ws3=XLSX.utils.aoa_to_sheet([h3,...pr3]);
  ws3['!cols']=[{wch:12},{wch:10},{wch:10},{wch:6},{wch:6},{wch:6},{wch:8}];
  XLSX.utils.book_append_sheet(wb,ws3,'담당자별');

  // Sheet 4: 마일스톤
  const h4=['마일스톤','이름','주차','예정일','담당','상태'];
  const pr4=D.filter(r=>r.t==='m').map(r=>[r.id,r.n.replace('◆ ',''),r.s,fmtDateFull(weekStartDate(r.s)),r.owner||'',SL[r.st]||r.st]);
  const ws4=XLSX.utils.aoa_to_sheet([h4,...pr4]);
  ws4['!cols']=[{wch:8},{wch:30},{wch:6},{wch:12},{wch:10},{wch:8}];
  XLSX.utils.book_append_sheet(wb,ws4,'마일스톤');

  XLSX.writeFile(wb,'WBS_GCGF0323_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

  initWeekSel();
  render();
  if(TODAY_W>=1&&TODAY_W<=TW) setTimeout(()=>jumpToWeek(TODAY_W),400);
