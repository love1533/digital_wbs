<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>컨설팅 프로젝트 WBS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;font-size:13px}
header{background:linear-gradient(135deg,#1e293b,#0f172a);border-bottom:1px solid #334155;padding:1rem 1.5rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
header h1{font-size:1.2rem;font-weight:700;color:#38bdf8}
.badge{background:#1e3a5f;color:#38bdf8;font-size:.65rem;padding:.15rem .5rem;border-radius:9999px;border:1px solid #1d4ed8}
.badge.green{background:#052e16;color:#4ade80;border-color:#166534}
.badge.amber{background:#2d1a00;color:#fbbf24;border-color:#92400e}
.gh-link{display:inline-flex;align-items:center;gap:.35rem;color:#94a3b8;font-size:.72rem;text-decoration:none;border:1px solid #334155;padding:.25rem .6rem;border-radius:.3rem;transition:all .15s;margin-left:auto}
.gh-link:hover{color:#38bdf8;border-color:#38bdf8}

/* Tabs */
.tabs{background:#1e293b;border-bottom:1px solid #334155;display:flex;gap:0;padding:0 1.5rem}
.tab-btn{padding:.65rem 1.1rem;font-size:.78rem;color:#64748b;border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab-btn:hover{color:#94a3b8}
.tab-btn.active{color:#38bdf8;border-bottom-color:#38bdf8}
.tab-panel{display:none}.tab-panel.active{display:block}

/* Toolbar */
.toolbar{background:#1a2332;border-bottom:1px solid #334155;padding:.5rem 1.5rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.tb-btn{background:#0f172a;color:#94a3b8;border:1px solid #334155;border-radius:.25rem;padding:.25rem .6rem;font-size:.72rem;cursor:pointer;transition:all .15s}
.tb-btn:hover{color:#38bdf8;border-color:#38bdf8}
.tb-btn.on{background:#1e3a5f;color:#38bdf8;border-color:#1d4ed8}
.progress-wrap{margin-left:auto;display:flex;align-items:center;gap:.6rem;font-size:.72rem;color:#64748b}
.pbar{width:120px;height:5px;background:#1e293b;border-radius:3px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,#22c55e,#38bdf8);border-radius:3px;transition:width .4s}

/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem;padding:1rem 1.5rem}
@media(max-width:700px){.stats-row{grid-template-columns:repeat(3,1fr)}}
.sc{background:#1e293b;border:1px solid #334155;border-radius:.5rem;padding:.65rem .85rem}
.sc-label{font-size:.62rem;color:#475569;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.3rem}
.sc-val{font-size:1.2rem;font-weight:700;color:#38bdf8}
.sc-sub{font-size:.62rem;color:#334155;margin-top:.15rem}

/* WBS Tree */
.wbs-wrap{padding:0 1.5rem 2rem}
.phase-block{background:#1e293b;border:1px solid #334155;border-radius:.6rem;margin-bottom:.75rem;overflow:hidden}
.phase-hdr{display:flex;align-items:center;gap:.6rem;padding:.75rem 1rem;cursor:pointer;user-select:none;transition:background .15s}
.phase-hdr:hover{background:#263347}
.chevron{color:#64748b;font-size:.7rem;transition:transform .2s;width:12px}
.chevron.open{transform:rotate(90deg)}
.phase-id{font-size:.68rem;font-weight:700;padding:.12rem .45rem;border-radius:.2rem;min-width:2rem;text-align:center}
.phase-name{font-weight:600;font-size:.88rem;flex:1}
.phase-stat{font-size:.68rem;color:#64748b;display:flex;align-items:center;gap:.4rem}
.mbar{width:50px;height:3px;background:#0f172a;border-radius:2px;overflow:hidden}
.mfill{height:100%;border-radius:2px}

/* Task rows */
.task-rows{border-top:1px solid #1a2332}
.tr{display:flex;align-items:flex-start;gap:.5rem;padding:.45rem .75rem;border-radius:.3rem;transition:background .1s;margin:.1rem .35rem}
.tr:hover{background:#1a2540}
.tr.milestone-row{background:#1a1a30;border-left:3px solid #fbbf24;border-radius:0}
.tr.milestone-row:hover{background:#232340}
.chk{margin-top:.1rem;width:14px;height:14px;border-radius:.2rem;border:1.5px solid #334155;background:#0f172a;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.chk.done{background:#166534;border-color:#22c55e}
.chk.doing{background:#1e3a5f;border-color:#38bdf8}
.chk.review{background:#2d1a00;border-color:#fbbf24}
.chk svg{width:9px;height:9px}
.tbody{flex:1;min-width:0}
.trow1{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.tid{color:#475569;font-size:.65rem;font-family:monospace;flex-shrink:0;min-width:3.5rem}
.tname{font-size:.82rem;color:#cbd5e1}
.tname.done{text-decoration:line-through;color:#475569}
.milestone-mark{color:#fbbf24;font-size:.7rem}
.area-tag{font-size:.58rem;padding:.08rem .35rem;border-radius:.2rem;font-weight:600;flex-shrink:0}
.stag{font-size:.6rem;padding:.07rem .35rem;border-radius:.15rem;font-weight:600;flex-shrink:0}
.stag.done{background:#052e16;color:#4ade80}
.stag.doing{background:#1e3a5f;color:#38bdf8}
.stag.review{background:#2d1a00;color:#fbbf24}
.stag.todo{background:#1a1a2e;color:#475569}
.req-ids{font-size:.58rem;color:#334155;flex-shrink:0}
.tdate{font-size:.65rem;color:#334155;flex-shrink:0;margin-left:auto}
.tdesc{font-size:.68rem;color:#475569;margin-top:.15rem}
.subs{margin:.25rem 0 0 1rem;border-left:1px dashed #334155;padding-left:.65rem}
.sub{display:flex;align-items:center;gap:.4rem;padding:.18rem .2rem;font-size:.73rem;color:#475569}
.sub:hover{color:#64748b}
.sdot{width:4px;height:4px;border-radius:50%;background:#334155;flex-shrink:0}
.sdot.done{background:#22c55e}.sdot.doing{background:#38bdf8}

/* Gantt mini bar in task */
.gantt-mini{display:flex;align-items:center;gap:.3rem;flex-shrink:0}
.g-bar{height:4px;border-radius:2px;opacity:.7}

/* Area colors */
.area-이지원{background:#1a2d4a;color:#60a5fa;border:1px solid #1e3a5f}
.area-사이버{background:#2d1a2d;color:#c084fc;border:1px solid #4c1d95}
.area-콜센터{background:#1a2d2d;color:#34d399;border:1px solid #065f46}
.area-인프라{background:#2d2a1a;color:#fbbf24;border:1px solid #92400e}
.area-PMO{background:#1a1a2d;color:#94a3b8;border:1px solid #334155}

/* ── Tab 2: Requirements ── */
.req-wrap{padding:1rem 1.5rem 2rem}
.req-filter{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.85rem}
.cat-btn{font-size:.68rem;padding:.2rem .6rem;border-radius:.25rem;border:1px solid #334155;background:#0f172a;color:#64748b;cursor:pointer;transition:all .15s}
.cat-btn:hover,.cat-btn.on{color:#38bdf8;border-color:#38bdf8;background:#1e3a5f}
table{width:100%;border-collapse:collapse;font-size:.75rem}
th{background:#1e293b;color:#64748b;font-weight:600;padding:.45rem .6rem;text-align:left;border-bottom:1px solid #334155;white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:.38rem .6rem;border-bottom:1px solid #1e293b;vertical-align:top;color:#94a3b8}
tr:hover td{background:#1a2332}
.req-id{font-family:monospace;font-size:.7rem;white-space:nowrap}
.req-cat{font-size:.62rem;padding:.08rem .35rem;border-radius:.2rem;font-weight:600;white-space:nowrap}
.cat-CSR{background:#1e3a5f;color:#38bdf8}.cat-SFR{background:#2d1a2d;color:#c084fc}
.cat-PER{background:#1a2d2d;color:#34d399}.cat-INR{background:#2d2a1a;color:#fbbf24}
.cat-DAR{background:#1a2d4a;color:#60a5fa}.cat-TER{background:#2d1a1a;color:#f87171}
.cat-SER{background:#1a2d1a;color:#4ade80}.cat-QUR{background:#2a1a2d;color:#e879f9}
.cat-COR{background:#2d2d1a;color:#facc15}.cat-PMR{background:#1a1a2d;color:#94a3b8}
.req-wbs{font-size:.68rem;color:#475569}
.done-chk{width:14px;height:14px;border-radius:.2rem;border:1.5px solid #334155;background:#0f172a;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.done-chk.on{background:#166534;border-color:#22c55e}

/* ── Tab 3: Staffing ── */
.staff-wrap{padding:1rem 1.5rem 2rem}
.staff-note{font-size:.72rem;color:#475569;margin-bottom:.85rem}
.staff-table{width:100%;border-collapse:collapse;font-size:.75rem}
.staff-table th{background:#1e293b;color:#64748b;font-weight:600;padding:.45rem .6rem;text-align:center;border:1px solid #334155;white-space:nowrap}
.staff-table th.left{text-align:left}
.staff-table td{padding:.38rem .6rem;border:1px solid #1e293b;text-align:center;color:#94a3b8}
.staff-table td.left{text-align:left;color:#cbd5e1}
.staff-table td.sub{background:#1a2332;font-weight:600;color:#64748b}
.staff-table td.total{background:#1e293b;font-weight:700;color:#38bdf8}
.mm-val{color:#38bdf8;font-weight:600}
.mm-zero{color:#1e293b}
.role-label{display:flex;flex-direction:column;gap:.1rem}
.role-name{font-size:.78rem;font-weight:600;color:#e2e8f0}
.role-area{font-size:.62rem;color:#475569}
</style>
</head>

// ══════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════
const tStatus = {};
const pOpen = {};
let curFilter = 'all';
const reqDone = {};

PHASES.forEach(ph => {
  pOpen[ph.id] = true;
  ph.tasks.forEach(t => { tStatus[t.id] = t.status; });
});
REQS.forEach(r => { reqDone[r.id] = false; });

// ══════════════════════════════════════════════════════════
// TABS
// ══════════════════════════════════════════════════════════
function showTab(id, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
}

// ══════════════════════════════════════════════════════════
// WBS RENDER
// ══════════════════════════════════════════════════════════
const SL = {done:'완료',doing:'진행중',review:'검토중',todo:'대기'};
const AREA_COLOR = {'이지원':'area-이지원','사이버':'area-사이버','콜센터':'area-콜센터','인프라':'area-인프라','PMO':'area-PMO'};

function cycleStatus(id) {
  const ord = ['todo','doing','review','done'];
  tStatus[id] = ord[(ord.indexOf(tStatus[id])+1) % ord.length];
  renderWBS();
}

function togglePhase(id) { pOpen[id] = !pOpen[id]; renderWBS(); }
function expandAll()  { PHASES.forEach(p => pOpen[p.id]=true);  renderWBS(); }
function collapseAll(){ PHASES.forEach(p => pOpen[p.id]=false); renderWBS(); }
function setFilter(f) {
  curFilter = f;
  ['all','todo','doing','review','done'].forEach(x => document.getElementById('f-'+x)?.classList.toggle('on', x===f));
  renderWBS();
}

function calcStats() {
  let total=0, done=0, doing=0;
  PHASES.forEach(ph => ph.tasks.forEach(t => {
    if (t.milestone) return;
    total++; const s=tStatus[t.id];
    if(s==='done') done++;
    if(s==='doing') doing++;
  }));
  return {total,done,doing};
}

function checkIcon(s) {
  if(s==='done') return '<svg viewBox="0 0 12 12" fill="none"><polyline points="1.5,6 4.5,9 10.5,3" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  if(s==='doing') return '<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="2.5" fill="#38bdf8"/></svg>';
  if(s==='review') return '<svg viewBox="0 0 12 12" fill="none"><line x1="6" y1="2" x2="6" y2="7" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/><circle cx="6" cy="9.5" r="1" fill="#fbbf24"/></svg>';
  return '';
}

function renderWBS() {
  const {total,done,doing} = calcStats();
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('prog-txt').textContent = pct+'%';
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-doing').textContent = doing;

  let html = '';
  PHASES.forEach(ph => {
    const filtered = ph.tasks.filter(t => curFilter==='all' || tStatus[t.id]===curFilter || t.milestone);
    if (!filtered.length && curFilter!=='all') return;

    const nonMs = ph.tasks.filter(t=>!t.milestone);
    const phDone = nonMs.filter(t=>tStatus[t.id]==='done').length;
    const phPct = nonMs.length ? Math.round(phDone/nonMs.length*100) : 0;
    const open = pOpen[ph.id];

    html += `<div class="phase-block">
      <div class="phase-hdr" onclick="togglePhase('${ph.id}')">
        <span class="chevron ${open?'open':''}">▶</span>
        <span class="phase-id" style="background:${ph.phColor};color:${ph.color}">${ph.id}</span>
        <span class="phase-name" style="color:${ph.color}">${ph.name}</span>
        <span style="font-size:.65rem;color:#475569">${ph.weeks}</span>
        <div class="phase-stat">
          <span>${phDone}/${nonMs.length}</span>
          <div class="mbar"><div class="mfill" style="width:${phPct}%;background:${ph.color}"></div></div>
        </div>
      </div>`;

    if (open) {
      html += `<div class="task-rows">`;
      filtered.forEach(t => {
        const s = tStatus[t.id];
        const isMile = !!t.milestone;
        const ac = AREA_COLOR[t.area] || 'area-PMO';
        const reqStr = t.reqs && t.reqs.length ? t.reqs.slice(0,3).join(' ') + (t.reqs.length>3?'…':'') : '';
        const subsHtml = t.subs ? t.subs.map(sb =>
          `<div class="sub"><div class="sdot ${s==='done'?'done':s==='doing'?'doing':''}"></div><span>${sb}</span></div>`
        ).join('') : '';

        html += `<div class="tr${isMile?' milestone-row':''}">
          <div class="chk ${s}" onclick="cycleStatus('${t.id}')" title="상태 변경">${checkIcon(s)}</div>
          <div class="tbody">
            <div class="trow1">
              <span class="tid">${t.id}</span>
              <span class="tname${s==='done'?' done':''}">${isMile?'<span class="milestone-mark">◆ </span>':''}${isMile?t.name.replace('◆ ',''):t.name}</span>
              <span class="area-tag ${ac}">${t.area}</span>
              ${!isMile?`<span class="stag ${s}">${SL[s]}</span>`:''}
              ${reqStr?`<span class="req-ids">${reqStr}</span>`:''}
              <span class="tdate">${t.weeks||''}</span>
            </div>
            ${t.desc?`<div class="tdesc">${t.desc}</div>`:''}
            ${subsHtml?`<div class="subs">${subsHtml}</div>`:''}
          </div>
        </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  });
  document.getElementById('wbs-root').innerHTML = html;
}

// ══════════════════════════════════════════════════════════
// REQUIREMENTS
// ══════════════════════════════════════════════════════════
let curCat = 'ALL';
function filterReq(cat, btn) {
  curCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  renderReqs();
}

function toggleReqDone(id) {
  reqDone[id] = !reqDone[id];
  renderReqs();
}

function renderReqs() {
  const list = curCat==='ALL' ? REQS : REQS.filter(r=>r.cat===curCat);
  const tbody = document.getElementById('req-tbody');
  tbody.innerHTML = list.map(r => `
    <tr>
      <td class="req-id">${r.id}</td>
      <td><span class="req-cat cat-${r.cat}">${r.cat}</span></td>
      <td style="color:#cbd5e1">${r.name}</td>
      <td><span class="area-tag ${AREA_COLOR[r.area]||'area-PMO'}">${r.area}</span></td>
      <td class="req-wbs">${r.wbs}</td>
      <td style="text-align:center"><div class="done-chk ${reqDone[r.id]?'on':''}" onclick="toggleReqDone('${r.id}')">${reqDone[r.id]?'<svg width="9" height="9" viewBox="0 0 12 12" fill="none"><polyline points="1.5,6 4.5,9 10.5,3" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</div></td>
    </tr>`).join('');
}

// ══════════════════════════════════════════════════════════
// STAFFING
// ══════════════════════════════════════════════════════════
function renderStaff() {
  const months = ['M1\n(3월)','M2\n(4월)','M3\n(5월)','M4\n(6월)','M5\n(7월)','M6\n(8월)','M7\n(9월)'];
  const areas = ['PMO','UI·UX','이지원·사이버','콜센터','공통인프라'];
  const areaColor = {'PMO':'#94a3b8','UI·UX':'#c084fc','이지원·사이버':'#60a5fa','콜센터':'#34d399','공통인프라':'#fbbf24'};

  let html = `<thead><tr>
    <th class="left" style="width:160px">역할</th>
    <th class="left" style="width:90px">영역</th>`;
  months.forEach(m => { html += `<th style="white-space:pre-line;font-size:.65rem">${m}</th>`; });
  html += `<th>합계</th></tr></thead><tbody>`;

  // Group by area
  areas.forEach(area => {
    const members = STAFF.filter(s => s.area===area);
    members.forEach((s,idx) => {
      const rowTotal = s.m.reduce((a,b)=>a+b,0).toFixed(1);
      html += `<tr>
        <td class="left"><div class="role-label"><span class="role-name">${s.role}</span></div></td>
        <td class="left"><span style="font-size:.65rem;color:${areaColor[area]||'#94a3b8'}">${area}</span></td>`;
      s.m.forEach(v => {
        html += `<td class="${v>0?'mm-val':'mm-zero'}">${v>0?v:'-'}</td>`;
      });
      html += `<td class="total">${rowTotal}</td></tr>`;
    });

    // Area subtotal
    const subTotals = [0,1,2,3,4,5,6].map(i => members.reduce((sum,s)=>sum+(s.m[i]||0),0));
    const areaTotal = subTotals.reduce((a,b)=>a+b,0).toFixed(1);
    html += `<tr>
      <td colspan="2" class="sub" style="text-align:right;font-size:.68rem">${area} 소계</td>`;
    subTotals.forEach(v => { html += `<td class="sub" style="color:#64748b">${v>0?v.toFixed(1):'-'}</td>`; });
    html += `<td class="sub" style="color:#fbbf24">${areaTotal}</td></tr>`;
  });

  // Grand total
  const grand = [0,1,2,3,4,5,6].map(i => STAFF.reduce((sum,s)=>sum+(s.m[i]||0),0));
  const grandTotal = grand.reduce((a,b)=>a+b,0).toFixed(1);
  html += `<tr>
    <td colspan="2" class="total" style="text-align:right">전체 합계</td>`;
  grand.forEach(v => { html += `<td class="total">${v.toFixed(1)}</td>`; });
  html += `<td class="total">${grandTotal} MM</td></tr>`;

  html += '</tbody>';
  document.getElementById('staff-table').innerHTML = html;
}

// INIT
renderWBS();
renderReqs();
