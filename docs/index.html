const HASH = "3e4df03324f19acc8efdb00a9f162cb279a64e06dc662ac5fcd6d17ca5917b83";
async function sha256(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function auth(){
  const v=document.getElementById('pw').value;
  if(!v){setErr('비밀번호를 입력해주세요');return;}
  if(await sha256(v)===HASH){
    sessionStorage.setItem('wbs','1');
    open_main();
  } else {
    setErr('비밀번호가 올바르지 않습니다');
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
  }
}
function setErr(m){const e=document.getElementById('gerr');e.textContent=m;setTimeout(()=>e.textContent='',2500)}
function open_main(){
  document.getElementById('gate').style.display='none';
  document.getElementById('main').style.display='block';
  init();
}
if(sessionStorage.getItem('wbs')==='1') open_main();
else document.getElementById('pw').focus();

function weekStartDate(w){
  const d = new Date(PROJECT_START);
  d.setDate(d.getDate() + (w-1)*7);
  return d;
}
function fmtDate(d){
  return `${d.getMonth()+1}/${d.getDate()}`;
}

// ═══ 주차 선택 초기화 ══════════════════════════════════════
function initWeekSel(){
  const sel=document.getElementById('weekSel');
  MONTHS.forEach(m=>{
    for(let w=m.s;w<=m.e;w++){
      const d=weekStartDate(w);
      const opt=document.createElement('option');
      opt.value=w;
      opt.textContent=`W${w} — 2026년 ${m.n} ${fmtDate(d)}`;
      sel.appendChild(opt);
    }
  });
  // 오늘 정보 표시
  const ti=document.getElementById('today-info');
  if(TODAY_W>=1){
    ti.textContent=`🗓 현재: W${TODAY_W} (${fmtDate(TODAY)})`;
  } else {
    ti.textContent=`🗓 프로젝트 시작까지 D-${-diffDays}일`;
    ti.style.color='#7c3aed';
  }
}

// ═══ 통계 계산 ═════════════════════════════════════════════
function calcStats(){
  const ts=D.filter(r=>r.t==='t');
  const tot=ts.length;
  const dn =ts.filter(x=>x.st==='done').length;
  const dg =ts.filter(x=>x.st==='doing').length;
  const rv =ts.filter(x=>x.st==='review').length;
  const td =ts.filter(x=>x.st==='todo').length;
  const pct=tot?Math.round(dn/tot*100):0;

  document.getElementById('s-t').textContent=tot;
  document.getElementById('s-d').textContent=dn;
  document.getElementById('s-g').textContent=dg;
  document.getElementById('s-r').textContent=rv;
  document.getElementById('s-n').textContent=td;
  document.getElementById('pb-pct').textContent=pct+'%';
  document.getElementById('pb-fill').style.width=pct+'%';
  document.getElementById('h-done').textContent=dn+'/'+tot+' 완료';
  document.getElementById('h-pct').textContent=pct+'%';

  document.getElementById('pb-detail').innerHTML=
    `<span class="pb-stat"><span class="pbs-dot" style="background:#22c55e"></span>완료 ${dn}</span>`+
    `<span class="pb-stat"><span class="pbs-dot" style="background:#38bdf8"></span>진행 ${dg}</span>`+
    `<span class="pb-stat"><span class="pbs-dot" style="background:#fbbf24"></span>검토 ${rv}</span>`+
    `<span class="pb-stat"><span class="pbs-dot" style="background:#e2e8f0"></span>대기 ${td}</span>`;

  // Phase별 미니 진척바
  const phases=D.filter(r=>r.t==='p');
  const phHtml=phases.map(ph=>{
    let cp=null, inPhase=false;
    const kids=[];
    D.forEach(r=>{
      if(r.t==='p'){inPhase=(r.id===ph.id);cp=r.id;}
      if(r.t==='t'&&inPhase) kids.push(r);
    });
    const kdn=kids.filter(k=>k.st==='done').length;
    const pp=kids.length?Math.round(kdn/kids.length*100):0;
    const c=AC[ph.area]||'#64748b';
    return `<div class="ph-mini">
      <div class="ph-mini-lbl" title="${ph.n}">${ph.id} ${ph.n.replace('단계','')}</div>
      <div class="ph-mini-bar"><div class="ph-mini-fill" style="width:${pp}%;background:${c}"></div></div>
    </div>`;
  }).join('');
  document.getElementById('pb-phases').innerHTML=phHtml;
}

// ═══ 간트 렌더링 ═══════════════════════════════════════════
const pOpen={};
D.filter(r=>r.t==='p').forEach(r=>pOpen[r.id]=true);
let flt='all';

function render(){
  const tbl=document.getElementById('gtbl');
  tbl.innerHTML='';
  const thead=tbl.createTHead();

  // 헤더 행1: 월
  const hr1=thead.insertRow();
  hr1.innerHTML=`<th class="th-id" rowspan="2">ID</th><th class="th-nm" rowspan="2">작업명 / Task Name</th>`;
  MONTHS.forEach(m=>{
    const th=document.createElement('th');
    th.className='th-mo'; th.colSpan=m.e-m.s+1;
    th.textContent='2026년 '+m.n;
    hr1.appendChild(th);
  });

  // 헤더 행2: 주차
  const hr2=thead.insertRow();
  for(let w=1;w<=TW;w++){
    const d=weekStartDate(w);
    const th=document.createElement('th');
    th.className='th-w'+(w===TODAY_W?' th-w-now':w<TODAY_W?' th-w-past':'');
    th.textContent='W'+w;
    th.title=`W${w}: ${fmtDate(d)} ~ ${fmtDate(new Date(d.getTime()+6*86400000))}`;
    th.id='wh'+w;
    hr2.appendChild(th);
  }

  // 바디
  const tbody=tbl.createTBody();
  let curP=null;
  D.forEach(row=>{
    if(row.t==='p') curP=row.id;
    if(flt!=='all'&&row.t==='t'&&row.st!==flt) return;
    if(flt!=='all'&&row.t==='m') return;
    const isChild=row.t==='t'||row.t==='m';
    const hide=isChild&&curP&&!pOpen[curP];

    const tr=tbody.insertRow();
    tr.className='r-'+{p:'phase',t:'task',m:'ms'}[row.t]+(hide?' hidden':'');
    if(isChild) tr.dataset.ph=curP;

    // ID 셀
    const tdi=tr.insertCell(); tdi.className='td-id';
    if(row.t==='p'){
      const cv=document.createElement('span');
      cv.className='chv'+(pOpen[row.id]?' o':'');
      cv.textContent='▶'; cv.onclick=()=>togP(row.id);
      tdi.appendChild(cv);
      tdi.appendChild(document.createTextNode(' '+row.id));
      tdi.style.cssText='color:#475569;font-weight:700';
    } else {
      tdi.innerHTML=`<span style="color:#e2e8f0">└</span> ${row.id}`;
    }

    // Name 셀
    const tdn=tr.insertCell(); tdn.className='td-nm';
    const c=AC[row.area]||'#94a3b8';
    const rl=document.createElement('div'); rl.className='rl';
    const pip=document.createElement('div'); pip.className='rpip';
    if(row.t==='m'){
      pip.style.cssText=`background:#fbbf24;border-radius:2px`;
      rl.appendChild(pip);
      const sp=document.createElement('span');
      sp.style.cssText='color:#b45309;font-weight:700;font-size:.77rem';
      sp.textContent='◆ '+row.n.replace('◆ ','');
      rl.appendChild(sp);
    } else {
      pip.style.background=c;
      rl.appendChild(pip);
      const sp=document.createElement('span'); sp.className='rtxt';
      if(row.t==='p') sp.style.cssText='font-weight:700;font-size:.79rem;color:#1e293b';
      else sp.style.color=c;
      sp.textContent=row.n;
      rl.appendChild(sp);
      if(row.t==='t'){
        const bd=document.createElement('span');
        bd.className='sbadge '+SC[row.st];
        bd.textContent=SL[row.st];
        rl.appendChild(bd);
      }
    }
    tdn.appendChild(rl);

    // 주차 셀
    for(let w=1;w<=TW;w++){
      const td=tr.insertCell();
      const isPast=w<TODAY_W, isNow=w===TODAY_W;
      td.className='td-w'+(isNow?' col-now':isPast?' col-past':'');

      if(row.t==='m'){
        if(w===row.s){
          td.className+=' ms-cell';
          td.textContent='◆';
          td.title=`◆ ${row.n}\n${fmtDate(weekStartDate(w))}`;
        }
      } else if(w>=row.s&&w<=row.e){
        const isSE=row.s===row.e, isS=w===row.s, isE=w===row.e;
        const isP=row.t==='p';
        const div=document.createElement('div');
        let cls=isP?'bph':'bar';
        if(isSE) cls+=' bar-se';
        else if(isS) cls+=' bar-s';
        else if(isE) cls+=' bar-e';
        div.className=cls;
        div.style.background=c;
        if(!isP&&row.st==='done') div.classList.add('bar-done');
        td.appendChild(div);
        if(isS){
          const sd=weekStartDate(row.s), ed=weekStartDate(row.e);
          ed.setDate(ed.getDate()+6);
          td.title=`${row.id}: ${row.n}\n기간: ${fmtDate(sd)} ~ ${fmtDate(ed)} (${row.e-row.s+1}주)\n영역: ${row.area} | 상태: ${SL[row.st]||''}`;
          td.style.cursor='help';
        }
      }
    }
  });
}

// ═══ 컨트롤 ════════════════════════════════════════════════
function togP(pid){
  pOpen[pid]=!pOpen[pid];
  document.querySelectorAll(`[data-ph="${pid}"]`).forEach(tr=>tr.classList.toggle('hidden',!pOpen[pid]));
  render();
}
function setF(f,btn){
  flt=f;
  ['all','todo','doing','review','done'].forEach(x=>document.getElementById('f-'+x)?.classList.toggle('on',x===f));
  render();
}
function expAll(){D.filter(r=>r.t==='p').forEach(r=>pOpen[r.id]=true);render()}
function colAll(){D.filter(r=>r.t==='p').forEach(r=>pOpen[r.id]=false);render()}

// ─ 이번 주로 스크롤 ─
function goToday(){
  const w=Math.max(1,TODAY_W||1);
  jumpToWeek(w);
}
function jumpToWeek(w){
  w=parseInt(w);
  if(!w) return;
  const sc=document.getElementById('gscroll');
  const leftFixed=68+260; // id+name 고정폭
  const scrollTo=(w-1)*28-100;
  sc.scrollTo({left:Math.max(0,scrollTo),behavior:'smooth'});
  document.getElementById('weekSel').value=w;
}

// ─ Excel 내보내기 ─
function exportExcel(){
  if(typeof XLSX==='undefined'){alert('SheetJS 라이브러리 로딩 중입니다. 잠시 후 다시 시도해주세요.');return;}
  const wb=XLSX.utils.book_new();

  // ── Sheet 1: WBS 전체 ──
  const header=['ID','구분','작업명','업무영역','상태','시작주','종료주','기간(주)','시작일(예정)','종료일(예정)'];
  const typeLabel={p:'Phase',t:'Task',m:'Milestone'};
  const rows=D.map(r=>{
    const sd=weekStartDate(r.s);
    const ed=new Date(weekStartDate(r.e)); ed.setDate(ed.getDate()+6);
    return [
      r.id, typeLabel[r.t], r.n, r.area,
      SL[r.st]||r.st, r.s, r.e, r.e-r.s+1,
      sd.toISOString().slice(0,10),
      ed.toISOString().slice(0,10)
    ];
  });
  const ws1=XLSX.utils.aoa_to_sheet([header,...rows]);
  ws1['!cols']=[{wch:10},{wch:10},{wch:40},{wch:10},{wch:8},{wch:7},{wch:7},{wch:8},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws1,'WBS 전체');

  // ── Sheet 2: Phase별 진척 ──
  const phHeader=['Phase ID','Phase명','전체 작업','완료','진행중','검토중','대기','진척률(%)'];
  let curPh=null; const phRows=[];
  const phMap={};
  D.forEach(r=>{
    if(r.t==='p'){curPh=r.id;phMap[r.id]={ph:r,kids:[]};}
    else if(r.t==='t'&&curPh) phMap[curPh].kids.push(r);
  });
  Object.values(phMap).forEach(({ph,kids})=>{
    const tot=kids.length,dn=kids.filter(k=>k.st==='done').length,
          dg=kids.filter(k=>k.st==='doing').length,rv=kids.filter(k=>k.st==='review').length,
          td=kids.filter(k=>k.st==='todo').length;
    phRows.push([ph.id,ph.n,tot,dn,dg,rv,td,tot?Math.round(dn/tot*100):0]);
  });
  const ws2=XLSX.utils.aoa_to_sheet([phHeader,...phRows]);
  ws2['!cols']=[{wch:8},{wch:20},{wch:8},{wch:6},{wch:6},{wch:6},{wch:6},{wch:8}];
  XLSX.utils.book_append_sheet(wb,ws2,'Phase 진척');

  // ── Sheet 3: 마일스톤 ──
  const msHeader=['마일스톤ID','이름','주차','예정일','상태'];
  const msRows=D.filter(r=>r.t==='m').map(r=>{
    const d=weekStartDate(r.s);
    return [r.id,r.n.replace('◆ ',''),r.s,d.toISOString().slice(0,10),SL[r.st]||r.st];
  });
  const ws3=XLSX.utils.aoa_to_sheet([msHeader,...msRows]);
  ws3['!cols']=[{wch:8},{wch:30},{wch:6},{wch:12},{wch:8}];
  XLSX.utils.book_append_sheet(wb,ws3,'마일스톤');

  XLSX.writeFile(wb,'WBS_GCGF0323_'+new Date().toISOString().slice(0,10)+'.xlsx');
}
