<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>디지털고도화 구축 WBS 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f0f2f5; --surface: #fff; --surface-alt: #f8f9fb;
  --border: #e2e8f0; --border-strong: #cbd5e1;
  --text: #1e293b; --text-sub: #64748b; --text-muted: #94a3b8;
  --primary: #2563eb; --primary-light: #dbeafe;
  --green: #16a34a; --green-light: #dcfce7;
  --amber: #d97706; --amber-light: #fef3c7;
  --red: #dc2626; --red-light: #fee2e2;
  --gray: #6b7280; --gray-light: #f3f4f6;
  --radius: 10px; --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background:var(--bg); color:var(--text); font-size:13px; }

/* Header */
.header { background:linear-gradient(135deg,#0f172a,#1e293b); color:#fff; padding:0 24px; display:flex; align-items:stretch; min-height:56px; }
.header-left { display:flex; align-items:center; gap:12px; padding:12px 0; }
.header-left h1 { font-size:16px; font-weight:700; letter-spacing:-.3px; }
.header-left .sub { font-size:10px; color:var(--text-muted); margin-top:1px; }
.header-right { margin-left:auto; display:flex; align-items:center; gap:12px; }
.snap-sel { display:flex; align-items:center; gap:8px; }
.snap-sel label { font-size:10px; color:var(--text-muted); white-space:nowrap; }
.snap-sel select { background:#334155; color:#e2e8f0; border:1px solid #475569; border-radius:6px; padding:5px 10px; font-size:11px; cursor:pointer; outline:none; }
.snap-sel select:hover { border-color:#64748b; }
.snap-badge { font-size:10px; color:var(--text-muted); background:#334155; padding:3px 8px; border-radius:5px; white-space:nowrap; }

/* Tabs */
.tabs { display:flex; background:var(--surface); border-bottom:1px solid var(--border); padding:0 24px; overflow-x:auto; gap:2px; }
.tab { padding:12px 16px; cursor:pointer; font-size:12px; font-weight:500; color:var(--text-sub); border-bottom:2px solid transparent; transition:all .15s; white-space:nowrap; }
.tab:hover { color:var(--primary); background:var(--primary-light); }
.tab.active { color:var(--primary); border-bottom-color:var(--primary); font-weight:600; }

/* Content */
.content { max-width:1500px; margin:0 auto; padding:20px 24px; }
.content-full { max-width:100%; margin:0; padding:10px; }
.tab-panel { display:none; } .tab-panel.active { display:block; }

/* Section box */
.section { background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:16px; border:1px solid var(--border); }
.section-title { font-size:13px; font-weight:600; color:var(--text); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.section-title::before { content:''; width:3px; height:14px; background:var(--primary); border-radius:2px; }
.section-sub { font-size:10px; color:var(--text-muted); font-weight:400; }

/* Cards */
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:16px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; text-align:center; box-shadow:var(--shadow); }
.card .value { font-size:24px; font-weight:700; margin:4px 0 2px; line-height:1; }
.card .label { font-size:10px; color:var(--text-muted); }
.card[data-filter], .ac[data-filter] { cursor:pointer; transition:all .15s; }
.card[data-filter]:hover, .ac[data-filter]:hover { border-color:var(--primary); transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.1); }
.card[data-filter].selected, .ac[data-filter].selected { border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-light); }
.drill-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.drill-close { background:none; border:1px solid var(--border); border-radius:6px; padding:4px 12px; font-size:11px; cursor:pointer; color:var(--text-sub); }
.drill-close:hover { background:var(--surface-alt); }

/* Phase bars */
.phase-row { display:flex; align-items:center; margin-bottom:7px; }
.phase-row .pn { width:100px; font-size:11px; font-weight:500; color:var(--text-sub); }
.phase-row .bar-bg { flex:1; height:18px; background:var(--bg); border-radius:9px; overflow:hidden; position:relative; }
.phase-row .bar-fill { height:100%; border-radius:9px; position:absolute; top:0; left:0; display:flex; align-items:center; justify-content:flex-end; padding-right:6px; font-size:9px; color:#fff; font-weight:600; transition:width .5s; }
.phase-row .pct { width:44px; text-align:right; font-size:11px; font-weight:600; }
.phase-row .cnt { width:60px; text-align:right; font-size:10px; color:var(--text-muted); }

/* Charts */
.charts-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
.chart-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); }
.chart-box .section-title { margin-bottom:8px; }
.chart-box canvas { max-height:220px; }

/* Tables */
.tbl-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); overflow-x:auto; margin-bottom:14px; }
.tbl-wrap .section-title { margin-bottom:8px; }
.filters { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
.filters select, .filters input { padding:5px 10px; border:1px solid var(--border); border-radius:6px; font-size:11px; background:var(--surface); outline:none; }
.filters input:focus, .filters select:focus { border-color:var(--primary); }
table { width:100%; border-collapse:collapse; font-size:11px; }
th { background:var(--surface-alt); padding:8px; text-align:left; font-weight:600; border-bottom:2px solid var(--border); white-space:nowrap; color:var(--text-sub); font-size:10px; text-transform:uppercase; letter-spacing:.3px; }
td { padding:7px 8px; border-bottom:1px solid var(--bg); }
tr:hover td { background:#f8faff; }

/* Badges */
.badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:9px; font-weight:600; letter-spacing:.2px; }
.b-todo { background:var(--gray-light); color:var(--gray); }
.b-doing { background:var(--primary-light); color:var(--primary); }
.b-review { background:var(--amber-light); color:var(--amber); }
.b-done { background:var(--green-light); color:var(--green); }

/* Modal */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:100; align-items:center; justify-content:center; backdrop-filter:blur(2px); }
.modal-overlay.show { display:flex; }
.modal { background:var(--surface); border-radius:12px; padding:24px; width:90%; max-width:560px; max-height:80vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.2); }
.modal h3 { margin-bottom:14px; font-size:15px; }
.modal .close-btn { float:right; background:none; border:none; font-size:22px; cursor:pointer; color:var(--text-muted); line-height:1; }
.modal .close-btn:hover { color:var(--text); }

/* Gantt — index.html 동일 스타일 (검증된 디자인) */
.gantt-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow-x:auto; overflow-y:visible; }
.gantt-wrap::-webkit-scrollbar { height:8px; }
.gantt-wrap::-webkit-scrollbar-track { background:var(--surface-alt); }
.gantt-wrap::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:4px; }
.gantt-wrap { scrollbar-width:thin; scrollbar-color:#cbd5e1 var(--surface-alt); }
.gantt-toolbar { display:flex; gap:10px; padding:8px 14px; font-size:11px; color:var(--text-sub); border-bottom:1px solid var(--border); flex-wrap:wrap; align-items:center; background:var(--surface); position:sticky; top:0; z-index:20; }
.gantt-toolbar span { display:flex; align-items:center; gap:4px; }
.gantt-toolbar .gl-sq { width:12px; height:8px; border-radius:2px; display:inline-block; }
.gantt-toolbar .tsep { width:1px; height:14px; background:var(--border); margin:0 4px; }

.gt { border-collapse:collapse; font-size:12px; white-space:nowrap; width:max-content; min-width:100%; }
.gt th, .gt td { border:1px solid #e8ecf1; padding:0; }

/* 좌측 고정 열 */
.gt .g-n { position:sticky; left:0; z-index:10; background:var(--surface); padding:5px 8px; min-width:420px; width:420px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; border-right:2px solid var(--border-strong) !important; line-height:1.5; }
.gt .g-p-sub { font-size:10px; color:var(--text-muted); font-weight:400; margin-left:4px; }
.gt .g-wbs { color:#94a3b8; font-size:10px; font-family:monospace; }
.gt .g-meta { font-size:9px; color:#94a3b8; margin-left:6px; }
.gt .g-meta .g-owner { color:#6366f1; font-weight:500; }
.gt .g-meta .g-dates { color:#94a3b8; }

/* 트리 계층 */
.gt .g-lv0 { background:#f1f5f9; font-weight:700; font-size:12px; cursor:pointer; color:#475569; }
.gt .g-lv0:hover { background:#e2e8f0; }
.gt .g-lv1 { background:var(--surface); font-weight:600; font-size:11px; cursor:pointer; padding-left:20px !important; }
.gt .g-lv1:hover { background:#f8fafc; }
.gt .g-lv2 { padding-left:36px !important; font-size:11px; }
.gt .g-lv3 { padding-left:48px !important; font-size:11px; color:var(--text-sub); }
.gt .g-indent { color:#e2e8f0; margin-right:2px; }
.gt .g-toggle { display:inline-block; width:14px; font-size:9px; color:var(--text-muted); margin-right:2px; cursor:pointer; user-select:none; transition:transform .15s; }
.gt tr.g-collapsed { display:none; }
.gt tbody tr:hover td { background:#f5f8ff; }
.gt tbody tr:hover .g-n { background:#f5f8ff; }

/* 헤더: 월(다크) + 주차 */
.gt .g-hm { background:#334155; color:#e2e8f0; font-size:12px; font-weight:600; padding:6px 4px; text-align:center; position:sticky; top:0; z-index:6; border:1px solid #475569; }
.gt .g-hm.g-hn { position:sticky; left:0; z-index:12; min-width:420px; border-right:2px solid var(--border-strong) !important; background:#334155; }
.gt .g-hw { background:#f8fafc; font-size:11px; font-weight:600; padding:2px 1px; text-align:center; position:sticky; top:30px; z-index:5; color:#475569; border:1px solid #e8ecf1; width:52px; min-width:52px; }
.gt .g-hw .g-hw-dt { font-size:8px; color:#94a3b8; font-weight:400; }
.gt .g-hw.g-hn { position:sticky; left:0; z-index:11; min-width:420px; background:#f8fafc; border-right:2px solid var(--border-strong) !important; font-size:10px; color:var(--text-muted); }
.gt .g-w { width:52px; min-width:52px; }
.gt .g-month-start { border-left:2px solid #cbd5e1 !important; }

/* 오늘/과거 열 */
.gt td.g-col-now { background:#fefce8; }
.gt td.g-col-past { background:#fafafa; }
.gt .g-hw-now { background:#fef3c7 !important; color:#b45309 !important; font-weight:700; }
.gt .g-hw-past { color:#cbd5e1; }

/* 바 */
.gt .g-bar { height:18px; margin:6px 0; border-radius:0; position:relative; overflow:visible; }
.gt .g-bar-s { border-radius:4px 0 0 4px; }
.gt .g-bar-e { border-radius:0 4px 4px 0; }
.gt .g-bar-se { border-radius:4px; }
/* 진행: 진한 색 + 테두리 */
.gt .g-bar-doing { box-shadow:0 1px 3px rgba(0,0,0,.2); }
/* 대기: 빗금 패턴 + 연한 색 */
.gt .g-bar-todo { opacity:0.45; background-image:repeating-linear-gradient(135deg,transparent,transparent 4px,rgba(255,255,255,.3) 4px,rgba(255,255,255,.3) 8px); }
/* 완료: 체크 패턴 */
.gt .g-bar-done { opacity:0.5; background-image:repeating-linear-gradient(135deg,transparent,transparent 3px,rgba(255,255,255,.4) 3px,rgba(255,255,255,.4) 6px); }
/* 검토: 약간 투명 */
.gt .g-bar-review { opacity:0.85; }
.gt .g-bar-phase { height:5px; margin:14px 0; opacity:0.25; border-radius:0; }
.gt .g-bar-label { position:absolute; left:4px; top:0; line-height:18px; font-size:11px; color:#fff; font-weight:700; white-space:nowrap; overflow:visible; text-shadow:0 0 3px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.5); z-index:2; pointer-events:none; }
.gt .g-bar-label-out { position:absolute; left:4px; top:0; line-height:18px; font-size:11px; color:#1e293b; font-weight:700; white-space:nowrap; overflow:visible; text-shadow:0 0 2px rgba(255,255,255,.8); z-index:2; pointer-events:none; }

/* 반응형 */
@media (max-width:1200px) {
  .gt .g-n, .gt .g-hm.g-hn, .gt .g-hw.g-hn { min-width:300px; width:300px; font-size:11px; }
  .gt .g-w, .gt .g-hw { width:44px; min-width:44px; }
  .gt .g-meta { display:none; }
}
@media (max-width:768px) {
  .gt .g-n, .gt .g-hm.g-hn, .gt .g-hw.g-hn { min-width:180px; width:180px; font-size:10px; padding:3px 6px; }
  .gt .g-w, .gt .g-hw { width:36px; min-width:36px; }
  .gt .g-wbs, .gt .g-meta { display:none; }
}

/* Weekly */
.wk-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
.wk-header select { padding:6px 12px; border:1px solid var(--border); border-radius:6px; font-size:12px; background:var(--surface); cursor:pointer; }
.wk-summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:16px; }
.wk-sum-item { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); text-align:center; }
.wk-sum-item .wk-sum-label { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; }
.wk-sum-item .wk-sum-val { font-size:22px; font-weight:700; margin:4px 0 2px; line-height:1; }
.wk-sum-item .wk-sum-delta { font-size:11px; font-weight:600; }
.wk-sum-item .wk-sum-delta.up { color:var(--green); }
.wk-sum-item .wk-sum-delta.down { color:var(--red); }
.wk-sum-item .wk-sum-delta.flat { color:var(--gray); }
.wk-sum-item.highlight { border-left:3px solid var(--primary); }
.wk-phase-bar { display:flex; align-items:center; margin-bottom:6px; }
.wk-phase-bar .wk-pb-name { width:100px; font-size:11px; font-weight:500; }
.wk-phase-bar .wk-pb-track { flex:1; height:20px; background:var(--bg); border-radius:6px; position:relative; overflow:hidden; }
.wk-phase-bar .wk-pb-prev { position:absolute; top:0; left:0; height:100%; border-radius:6px; border-right:2px dashed rgba(0,0,0,.15); }
.wk-phase-bar .wk-pb-cur { position:absolute; top:0; left:0; height:100%; border-radius:6px; display:flex; align-items:center; justify-content:flex-end; padding-right:5px; font-size:9px; color:#fff; font-weight:600; transition:width .5s; }
.wk-phase-bar .wk-pb-info { width:140px; text-align:right; font-size:10px; color:var(--text-sub); }
.chg-row { display:flex; align-items:center; gap:8px; padding:7px 8px; border-bottom:1px solid var(--bg); font-size:11px; transition:background .1s; }
.chg-row:last-child { border-bottom:none; }
.chg-row:hover { background:var(--surface-alt); }
.chg-icon { width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; font-weight:700; }
.chg-icon.status { background:var(--primary-light); color:var(--primary); }
.chg-icon.new { background:var(--green-light); color:var(--green); }
.chg-icon.removed { background:var(--red-light); color:var(--red); }
.chg-key { font-weight:600; color:var(--primary); cursor:pointer; text-decoration:none; min-width:90px; }
.chg-arrow { color:var(--text-muted); font-size:13px; }
.delta { font-weight:600; font-size:11px; }
.delta.pos { color:var(--green); }
.delta.neg { color:var(--red); }
.delta.zero { color:var(--gray); }
.pill-btn { padding:5px 12px; border:1px solid var(--border); border-radius:16px; font-size:11px; cursor:pointer; background:var(--surface); color:var(--text-sub); font-weight:500; transition:all .15s; }
.pill-btn:hover { border-color:var(--primary); color:var(--primary); }
.pill-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
/* Progress banner (기존 index.html 참조) */
.prog-banner { background:linear-gradient(135deg,#0f172a,#1e3a5f); color:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 22px; margin-bottom:14px; display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
.pb-pct { font-size:3rem; font-weight:900; color:#38bdf8; min-width:6rem; line-height:1; letter-spacing:-.02em; text-shadow:0 2px 8px rgba(56,189,248,.3); }
.pb-info { flex:1; min-width:220px; }
.pb-label { font-size:11px; color:#cbd5e1; margin-bottom:6px; letter-spacing:.3px; }
.pb-bar { height:10px; background:rgba(255,255,255,.1); border-radius:5px; overflow:hidden; position:relative; }
.pb-fill { height:100%; background:linear-gradient(90deg,#22c55e,#38bdf8,#6366f1); border-radius:5px; transition:width .8s ease; box-shadow:0 0 12px rgba(56,189,248,.4); }
.pb-detail { display:flex; gap:14px; margin-top:8px; font-size:11px; color:#cbd5e1; flex-wrap:wrap; }
.pb-detail .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:middle; }
.pb-meta { display:flex; gap:10px; font-size:10px; color:#94a3b8; margin-top:6px; flex-wrap:wrap; }
.pb-meta span { background:rgba(255,255,255,.08); padding:2px 8px; border-radius:10px; }

/* Area cards (5-column, 업무영역별) */
.area-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-bottom:14px; }
.ac { background:var(--surface); border:2px solid transparent; border-radius:12px; padding:14px 16px; box-shadow:var(--shadow); transition:all .2s; cursor:default; }
.ac:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.08); }
.ac-label { font-size:11px; font-weight:600; color:var(--text-sub); margin-bottom:4px; display:flex; align-items:center; gap:6px; }
.ac-label::before { content:''; width:8px; height:8px; border-radius:50%; background:var(--ac-color,#64748b); }
.ac-pct { font-size:1.6rem; font-weight:900; color:var(--ac-color,#1e293b); line-height:1; margin:2px 0 4px; }
.ac-counts { font-size:10px; color:var(--text-muted); margin-bottom:6px; }
.ac-bar { height:5px; background:rgba(0,0,0,.06); border-radius:3px; overflow:hidden; }
.ac-fill { height:100%; background:var(--ac-color,#64748b); border-radius:3px; transition:width .5s; }
.msg { text-align:center; padding:50px 20px; color:var(--text-muted); font-size:14px; }
.msg.error { color:var(--red); }
@media (max-width:768px) { .charts-row { grid-template-columns:1fr; } .cards { grid-template-columns:repeat(2,1fr); } .header { flex-direction:column; gap:8px; } .header-right { margin-left:0; } }

/* Password gate */
#gate { position:fixed; inset:0; background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#1e1b4b 100%); display:flex; align-items:center; justify-content:center; z-index:9999; }
.gb { background:#fff; border-radius:20px; padding:2.4rem 2.8rem; width:420px; max-width:90vw; text-align:center; box-shadow:0 40px 80px rgba(0,0,0,.5); }
.gb-logo { display:flex; align-items:center; justify-content:center; gap:.6rem; margin-bottom:1.4rem; }
.gb-logo-icon { width:44px; height:44px; background:linear-gradient(135deg,#2563eb,#7c3aed); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.4rem; }
.gb-logo-text { font-size:.95rem; font-weight:700; color:#1e293b; text-align:left; line-height:1.2; }
.gb-logo-sub { font-size:.7rem; color:#64748b; text-align:left; margin-top:2px; }
.gb-title { font-size:1.2rem; font-weight:700; color:#1e293b; margin-bottom:.3rem; }
.gb-sub { font-size:.78rem; color:#64748b; margin-bottom:1.3rem; }
.gb input { width:100%; padding:.75rem 1rem; border:2px solid #e2e8f0; border-radius:10px; font-size:.95rem; outline:none; margin-bottom:.8rem; font-family:inherit; }
.gb input:focus { border-color:#2563eb; }
.gb button { width:100%; padding:.75rem; background:linear-gradient(135deg,#2563eb,#7c3aed); color:#fff; border:none; border-radius:10px; font-size:.95rem; font-weight:600; cursor:pointer; transition:all .2s; }
.gb button:hover { transform:translateY(-1px); box-shadow:0 10px 20px rgba(37,99,235,.3); }
.gb-err { font-size:.75rem; color:#dc2626; margin-top:.6rem; min-height:1rem; }

<script>
const PS=new Date('2026-04-02'), TW=30, JB='https://gcgfmobile.atlassian.net';
const PM={
  '0':{n:'PMO/사업관리',c:'#64748b'},'1':{n:'분석',c:'#3b82f6'},'2':{n:'설계',c:'#8b5cf6'},
  '3':{n:'개발/구축',c:'#10b981'},'4':{n:'테스트',c:'#f59e0b'},'5':{n:'이행/오픈',c:'#ef4444'},
  '6':{n:'안정화/성과',c:'#06b6d4'},'7':{n:'종료',c:'#78716c'}
};
const SL={todo:'대기',doing:'진행',review:'검토',done:'완료'};
const SC={todo:'b-todo',doing:'b-doing',review:'b-review',done:'b-done'};
const AKW={
  '이지원':['이지원','ezwon','마이다스','midas','법인','공동대표','ocr','챗봇','chatbot','팩토리','상품','app','앱','ai','고도화','보증신청','사후관리','native','보증상품','전자결재','결재','기안','모바일'],
  '인터넷웹':['사이버','cyber','보안','security','인증','취약점','iam','방화벽','사이버보증','보증','인터넷','웹','internet','web','전자서명','재무자료','마이데이터'],
  '콜센터':['콜센터','callcenter','call','cti','ivr','상담','녹취','ars','보이는ars','pbx','녹음','음성봇','콜봇','stt','aicc'],
  '인프라':['인프라','infra','infrastructure','server','서버','네트워크','db','배포','형상관리','소스코드','응답시간','자원사용률','성능','클라우드','k8s','ci/cd','waf','데이터','edw','bi','표준화','정제','정보계','싱글뷰'],
  'PMO':['킥오프','착수','사업수행','보고','관리','품질','감리','산출물','교육','안정화','모니터링','결함','kpi','개선','종료','납품','완료보고','요구사항추적']
};
// 업무영역 색상 (기존 index.html과 통일)
const AC={'이지원':'#3b82f6','인터넷웹':'#7c3aed','콜센터':'#10b981','인프라':'#f59e0b','PMO':'#64748b'};

let allSnapshots={}, curIssues=[], latestSnap=null, selectedSnapDate=null, snapshotDates=[];

function wbs(i){const l=(i.labels||[]).find(x=>x.startsWith('WBS_'));return l?l.replace('WBS_','').replace(/_/g,'.'):null;}
function pn(i){const c=wbs(i);return c?c.split('.')[0]:null;}
function pName(i){const p=pn(i);return p&&PM[p]?PM[p].n:'기타';}
function area(i){const t=[i.summary,...(i.labels||[])].join(' ').toLowerCase();for(const[a,ks]of Object.entries(AKW)){if(ks.some(k=>t.includes(k)))return a;}return 'PMO';}
function d2w(ds){if(!ds)return null;const d=new Date(ds),delta=Math.floor((d-PS)/864e5);return delta<0?1:Math.min(Math.floor(delta/7)+1,TW);}
function wsd(w){const d=new Date(PS);d.setDate(d.getDate()+(w-1)*7);return d;}
function fd(d){return(d.getMonth()+1)+'/'+d.getDate();}
function badge(s){return `<span class="badge ${SC[s]||'b-todo'}">${SL[s]||s}</span>`;}
function deltaHtml(v){if(v>0)return `<span class="delta pos">+${v}</span>`;if(v<0)return `<span class="delta neg">${v}</span>`;return `<span class="delta zero">-</span>`;}
function barColor(base,st){return{color:base,opacity:st==='done'?1:st==='doing'||st==='review'?0.7:0.35};}

// Tab switching (간트 탭은 full-width)
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-'+tab.dataset.tab).classList.add('active');
    const ct=document.querySelector('.content');
    if(tab.dataset.tab==='gantt') ct.classList.add('content-full');
    else ct.classList.remove('content-full');
  });
});

// === Snapshot selector ===
function switchSnapshot(date){
  selectedSnapDate=date;
  const data=allSnapshots[date];
  curIssues=data.issues.filter(i=>(i.labels||[]).some(l=>l.startsWith('WBS_')));
  document.getElementById('snapBadge').textContent=`${date} | ${curIssues.length}건 | 총 ${snapshotDates.length}개 스냅샷`;
  renderAll();
}

// === Load ===
async function loadData(){
  try{
    // 경로 자동 감지
    let base='docs/data/snapshots/';
    let ir=await fetch(base+'index.json?'+Date.now());
    if(!ir.ok){
      base='data/snapshots/';
      ir=await fetch(base+'index.json?'+Date.now());
    }
    if(!ir.ok) throw new Error('스냅샷 인덱스를 찾을 수 없습니다.');
    const idx=await ir.json();
    if(!idx.snapshots||!idx.snapshots.length) throw new Error('스냅샷이 없습니다.');

    // Load all snapshots (max 10 recent)
    const snaps=idx.snapshots.slice(0,10);
    for(const s of snaps){
      const r=await fetch(base+s.file+'?'+Date.now());
      allSnapshots[s.date]=await r.json();
    }
    snapshotDates=snaps.map(s=>s.date);

    // Populate selector
    const sel=document.getElementById('snapSelector');
    snaps.forEach((s,i)=>{
      const o=document.createElement('option');
      o.value=s.date;
      const d=new Date(s.date+'T12:00:00');
      const dayNames=['일','월','화','수','목','금','토'];
      o.textContent=`${s.date} (${dayNames[d.getDay()]}) — ${s.count}건`;
      if(i===0) o.selected=true;
      sel.appendChild(o);
    });

    latestSnap=snaps[0];
    switchSnapshot(latestSnap.date);
  }catch(e){
    document.querySelector('.content').innerHTML=`<div class="msg error">${e.message}</div>`;
  }
}

function renderAll(){renderOverview();renderWeekly();renderGantt();renderPhaseDetail();renderTasks();}

// === Overview ===
let sc1=null,sc2=null;
function renderOverview(){
  const tot=curIssues.length;
  const done=curIssues.filter(i=>i.status_wbs==='done').length;
  const doing=curIssues.filter(i=>i.status_wbs==='doing').length;
  const review=curIssues.filter(i=>i.status_wbs==='review').length;
  const todo=curIssues.filter(i=>i.status_wbs==='todo').length;
  const pct=tot?(done/tot*100).toFixed(1):0;
  const actPctAll=tot?((done+doing+review)/tot*100).toFixed(1):0;

  // 경과일/주차 계산
  const today=new Date();
  const projStart=new Date('2026-04-02'), projEnd=new Date('2026-10-30');
  const elapsed=Math.max(0,Math.floor((today-projStart)/864e5));
  const totalDays=Math.floor((projEnd-projStart)/864e5);
  const remaining=Math.max(0,totalDays-elapsed);
  const elapsedW=Math.min(Math.floor(elapsed/7)+1,TW);
  const timePct=totalDays?(elapsed/totalDays*100).toFixed(1):0;

  // Ring SVG
  const R=50, C=2*Math.PI*R;
  const donePct=parseFloat(pct);
  const ringColor=donePct>=80?'var(--green)':donePct>=40?'var(--primary)':donePct>=10?'var(--amber)':'var(--red)';
  const dashoff=C-(donePct/100)*C;

  document.getElementById('progressHero').innerHTML=`<div class="prog-banner">
    <div class="pb-pct">${pct}%</div>
    <div class="pb-info">
      <div class="pb-label">전체 진척률 (JIRA Task 기준) · ${done}/${tot} 완료</div>
      <div class="pb-bar"><div class="pb-fill" style="width:${pct}%"></div></div>
      <div class="pb-detail">
        <span><span class="dot" style="background:#16a34a"></span>완료 ${done}</span>
        <span><span class="dot" style="background:#2563eb"></span>진행 ${doing}</span>
        <span><span class="dot" style="background:#d97706"></span>검토 ${review}</span>
        <span><span class="dot" style="background:#94a3b8"></span>대기 ${todo}</span>
        <span style="margin-left:auto">착수율 <strong style="color:#38bdf8">${actPctAll}%</strong></span>
      </div>
      <div class="pb-meta">
        <span>📅 ${elapsed}일 경과 (W${elapsedW}/${TW})</span>
        <span>⏳ 잔여 ${remaining}일</span>
        <span>⏱ 기간 소진율 ${timePct}%</span>
        <span>${parseFloat(timePct)>parseFloat(actPctAll)?'⚠️ 일정 지연 추세':'✅ 일정 양호'}</span>
      </div>
    </div>
  </div>`;

  // 업무영역별 카드
  const areaStats={};
  Object.keys(AC).forEach(a=>{areaStats[a]={tot:0,done:0,doing:0,review:0};});
  curIssues.forEach(i=>{
    const a=area(i); if(!areaStats[a])areaStats[a]={tot:0,done:0,doing:0,review:0};
    areaStats[a].tot++;
    if(i.status_wbs==='done') areaStats[a].done++;
    else if(i.status_wbs==='doing') areaStats[a].doing++;
    else if(i.status_wbs==='review') areaStats[a].review++;
  });
  document.getElementById('areaCards').innerHTML=Object.entries(AC).map(([name,color])=>{
    const s=areaStats[name]||{tot:0,done:0,doing:0,review:0};
    const p=s.tot?(s.done/s.tot*100).toFixed(0):0;
    return `<div class="ac" data-filter="area:${name}" style="--ac-color:${color};border-color:${color}22;cursor:pointer" onclick="drillDown('area:${name}')">
      <div class="ac-label">${name}</div>
      <div class="ac-pct">${p}%</div>
      <div class="ac-counts">${s.done}/${s.tot} 완료 · 진행 ${s.doing} · 검토 ${s.review}</div>
      <div class="ac-bar"><div class="ac-fill" style="width:${p}%"></div></div>
    </div>`;
  }).join('');

  document.getElementById('overviewCards').innerHTML=`
    <div class="card" data-filter="all" onclick="drillDown('all')"><div class="label">전체 이슈</div><div class="value" style="color:var(--primary)">${tot}</div></div>
    <div class="card" data-filter="done" onclick="drillDown('done')"><div class="label">완료</div><div class="value" style="color:var(--green)">${done}</div><div class="label">${pct}%</div></div>
    <div class="card" data-filter="doing" onclick="drillDown('doing')"><div class="label">진행</div><div class="value" style="color:#2196F3">${doing}</div></div>
    <div class="card" data-filter="review" onclick="drillDown('review')"><div class="label">검토</div><div class="value" style="color:var(--amber)">${review}</div></div>
    <div class="card" data-filter="todo" onclick="drillDown('todo')"><div class="label">대기</div><div class="value" style="color:var(--gray)">${todo}</div></div>
    <div class="card"><div class="label">경과 주차</div><div class="value" style="font-size:18px">W${elapsedW}<span style="font-size:12px;color:var(--text-muted)">/${TW}</span></div><div class="label">잔여 ${remaining}일</div></div>`;

  document.getElementById('phaseBarList').innerHTML=Object.entries(PM).map(([p,v])=>{
    const pi=curIssues.filter(i=>pn(i)===p),cnt=pi.length;
    const dn=pi.filter(i=>i.status_wbs==='done').length;
    const dg=pi.filter(i=>i.status_wbs==='doing'||i.status_wbs==='review').length;
    const pct=cnt?(dn/cnt*100):0;
    const actPct=cnt?((dn+dg)/cnt*100):0;
    return `<div class="phase-row">
      <div class="pn" style="color:${v.c}">${v.n}</div>
      <div class="bar-bg">
        <div class="bar-fill" style="width:${actPct}%;background:${v.c};opacity:0.2"></div>
        <div class="bar-fill" style="width:${pct}%;background:${v.c}">${pct>8?pct.toFixed(0)+'%':''}</div>
      </div>
      <div class="pct">${pct.toFixed(0)}%</div>
      <div class="cnt">${dn}/${cnt}건</div>
    </div>`;
  }).join('');

  if(sc1)sc1.destroy();
  sc1=new Chart(document.getElementById('statusChart'),{type:'doughnut',data:{labels:['대기','진행','검토','완료'],datasets:[{data:[todo,doing,review,done],backgroundColor:['#9E9E9E','#2196F3','#F59E0B','#16A34A'],borderWidth:0}]},options:{responsive:true,cutout:'55%',plugins:{legend:{position:'bottom',labels:{font:{size:10},padding:12,usePointStyle:true,pointStyle:'circle'}}}}});
  const am={};curIssues.forEach(i=>{const a=area(i);am[a]=(am[a]||0)+1;});
  const al=Object.keys(am).sort((a,b)=>am[b]-am[a]);
  if(sc2)sc2.destroy();
  sc2=new Chart(document.getElementById('areaChart'),{type:'bar',data:{labels:al,datasets:[{label:'이슈',data:al.map(a=>am[a]),backgroundColor:al.map(a=>AC[a]||'#94a3b8'),borderRadius:4}]},options:{responsive:true,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{grid:{display:false}}}}});
}

// === Weekly Analysis (금~목 기준) ===
function getWeekFriThu(dateStr){
  const d=new Date(dateStr+'T12:00:00');
  const day=d.getDay();
  const offset=(day+2)%7;
  const fri=new Date(d); fri.setDate(d.getDate()-offset);
  const thu=new Date(fri); thu.setDate(fri.getDate()+6);
  return {fri,thu,key:fri.toISOString().slice(0,10)};
}
function groupSnapshotsByWeek(){
  const dates=Object.keys(allSnapshots).sort();
  const weeks={};
  dates.forEach(d=>{
    const w=getWeekFriThu(d);
    if(!weeks[w.key]) weeks[w.key]={fri:w.fri,thu:w.thu,snapshots:[]};
    weeks[w.key].snapshots.push(d);
  });
  return Object.entries(weeks).map(([k,v])=>({
    key:k,fri:v.fri,thu:v.thu,
    latestDate:v.snapshots.sort().pop(),
    snapCount:v.snapshots.length
  })).sort((a,b)=>b.key.localeCompare(a.key));
}
function fmtDate(d){return(d.getMonth()+1)+'/'+d.getDate();}
function wkDeltaBlock(cur,prev,unit=''){
  const diff=cur-prev;
  const cls=diff>0?'up':diff<0?'down':'flat';
  const sign=diff>0?'+':'';
  const arrow=diff>0?'▲':diff<0?'▼':'—';
  return `<span class="wk-sum-delta ${cls}">${arrow} ${sign}${unit==='%'?diff.toFixed(1):diff}${unit}</span>`;
}

let weeklyChart1=null;
function renderWeekly(){
  const weeks=groupSnapshotsByWeek();
  if(weeks.length<2){
    document.getElementById('weeklyContent').innerHTML='<div class="msg">주간 비교를 위해 최소 2주의 스냅샷이 필요합니다.</div>';
    return;
  }
  let selHtml='<select id="weekSelector" onchange="renderWeeklyDetail()">';
  weeks.forEach((w,i)=>{
    if(i>=weeks.length-1) return;
    selHtml+=`<option value="${i}" ${i===0?'selected':''}>${fmtDate(w.fri)}(금) ~ ${fmtDate(w.thu)}(목)</option>`;
  });
  selHtml+='</select>';
  document.getElementById('weeklyContent').innerHTML=`
    <div class="wk-header">
      <div class="section-title" style="margin-bottom:0">주간 진척 분석 <span class="section-sub">(금~목 기준)</span></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:11px;color:var(--text-sub)">주차:</span>${selHtml}
      </div>
    </div>
    <div id="weeklyDetailContent"></div>`;
  window._weeklyWeeks=weeks;
  renderWeeklyDetail();
}

function renderWeeklyDetail(){
  const weeks=window._weeklyWeeks;
  const idx=parseInt(document.getElementById('weekSelector').value);
  const curWeek=weeks[idx], prevWeek=weeks[idx+1];
  const curDate=curWeek.latestDate, prevDate=prevWeek.latestDate;
  const curData=allSnapshots[curDate].issues.filter(i=>(i.labels||[]).some(l=>l.startsWith('WBS_')));
  const prevData=allSnapshots[prevDate].issues.filter(i=>(i.labels||[]).some(l=>l.startsWith('WBS_')));
  const curMap=Object.fromEntries(curData.map(i=>[i.key,i]));
  const prevMap=Object.fromEntries(prevData.map(i=>[i.key,i]));

  const curSt={todo:0,doing:0,review:0,done:0};
  const prevSt={todo:0,doing:0,review:0,done:0};
  curData.forEach(i=>{curSt[i.status_wbs]=(curSt[i.status_wbs]||0)+1;});
  prevData.forEach(i=>{prevSt[i.status_wbs]=(prevSt[i.status_wbs]||0)+1;});
  const curDR=curData.length?((curSt.done||0)/curData.length*100):0;
  const prevDR=prevData.length?((prevSt.done||0)/prevData.length*100):0;

  const statusChanges=[],newIssues=[],removedIssues=[];
  curData.forEach(i=>{

      <div style="font-size:11px;color:var(--text-sub);text-align:center;padding-top:8px;border-top:1px solid var(--bg)">총 <strong>${totalChg}건</strong> 변동</div>

  if(totalChg>0){

      <button onclick="filterWkChg('new')" class="pill-btn" data-f="new">신규 ${newIssues.length}</button>

    statusChanges.forEach(c=>{

    newIssues.forEach(i=>{

    html+=`</div></div>`;
  }

  html+=`<div class="tbl-wrap"><div class="section-title">페이즈별 상세 비교</div>
    <table><thead><tr><th>페이즈</th><th>이슈 수</th><th>완료</th><th>진행/검토</th><th>완료율</th><th>변동</th></tr></thead>
    <tbody>${phaseComp.map(p=>{
      const pp=p.prevTotal?(p.prevDone/p.prevTotal*100):0;
      const cp=p.curTotal?(p.curDone/p.curTotal*100):0;
      const diff=cp-pp;
      const bg=diff>0?'background:var(--green-light)':diff<0?'background:var(--red-light)':'';
      return `<tr style="${bg}"><td><strong style="color:${p.color}">${p.phase}</strong></td>
        <td>${p.prevTotal}→${p.curTotal} ${deltaHtml(p.curTotal-p.prevTotal)}</td>
        <td>${p.prevDone}→${p.curDone} ${deltaHtml(p.curDone-p.prevDone)}</td>
        <td>${p.prevAct}→${p.curAct} ${deltaHtml(p.curAct-p.prevAct)}</td>
        <td>${pp.toFixed(0)}%→${cp.toFixed(0)}%</td>
        <td style="font-weight:600;${diff>0?'color:var(--green)':diff<0?'color:var(--red)':'color:var(--gray)'}">${diff>0?'+':''}${diff.toFixed(1)}%p</td></tr>`;
    }).join('')}</tbody></table></div>`;

  document.getElementById('weeklyDetailContent').innerHTML=html;
  if(weeklyChart1)weeklyChart1.destroy();
  const ctx=document.getElementById('weeklyBarChart');
  if(ctx){
    weeklyChart1=new Chart(ctx,{type:'bar',data:{
      labels:['완료','진행','검토','대기'],
      datasets:[
        {label:'전주',data:[prevSt.done||0,prevSt.doing||0,prevSt.review||0,prevSt.todo||0],backgroundColor:['#bbf7d0','#bfdbfe','#fde68a','#e5e7eb'],borderRadius:4},
        {label:'이번주',data:[curSt.done||0,curSt.doing||0,curSt.review||0,curSt.todo||0],backgroundColor:['#16a34a','#2196F3','#f59e0b','#9E9E9E'],borderRadius:4}
      ]},options:{responsive:true,plugins:{legend:{position:'top',labels:{font:{size:10},usePointStyle:true,pointStyle:'circle',padding:12}}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid:{color:'#f1f5f9'}}}}});

// === Gantt (트리형 WBS, 접기/펼치기, 월 헤더 + 오늘 표시) ===

// WBS 코드 → 트리 노드 구성
function buildWbsTree(issues){
  const map={};
  issues.forEach(i=>{
    const code=wbs(i); if(!code)return;
    map[code]={code,issue:i,children:[],depth:code.split('.').length-1};
  });
  // 부모-자식 연결 (예: 1.1.1의 부모는 1.1)
  const roots=[];
  Object.values(map).forEach(node=>{
    const parts=node.code.split('.');
    if(parts.length>1){
      const parentCode=parts.slice(0,-1).join('.');
      if(map[parentCode]) map[parentCode].children.push(node);
      else roots.push(node);
    } else roots.push(node);
  });
  // 재귀 정렬
  function sortTree(nodes){
    nodes.sort((a,b)=>a.code.localeCompare(b.code,undefined,{numeric:true}));
    nodes.forEach(n=>sortTree(n.children));
  }
  sortTree(roots);
  return roots;
}

// 트리를 플랫 배열로 전개
function flattenTree(nodes, depth=0, parentCode=''){
  const result=[];
  nodes.forEach(node=>{
    const hasChildren=node.children.length>0;
    result.push({...node, depth, hasChildren, parentCode});
    if(hasChildren) result.push(...flattenTree(node.children, depth+1, node.code));
  });
  return result;
}

// 자식 범위 (start/end 주차) 집계
function getTreeRange(node){
  const i=node.issue;
  let sw=d2w(i.start_date), ew=d2w(i.due_date);
  if(node.children.length>0){
    node.children.forEach(c=>{
      const r=getTreeRange(c);
      if(r.sw && (!sw||r.sw<sw)) sw=r.sw;
      if(r.ew && (!ew||r.ew>ew)) ew=r.ew;
    });
  }
  return {sw:sw||1, ew:ew||sw||1};
}

// 자식 상태 집계
function getTreeStats(node){
  if(node.children.length===0) return {total:1, done:node.issue.status_wbs==='done'?1:0, doing:node.issue.status_wbs==='doing'||node.issue.status_wbs==='review'?1:0};
  return node.children.reduce((acc,c)=>{
    const s=getTreeStats(c);
    return {total:acc.total+s.total, done:acc.done+s.done, doing:acc.doing+s.doing};
  },{total:0,done:0,doing:0});
}

function renderGantt(){
  const wrap=document.getElementById('ganttWrap');
  const today=new Date();
  const todayW=d2w(today.toISOString().slice(0,10));

  // 주차 정보
  const weekInfo=[];
  for(let w=1;w<=TW;w++){
    const d=wsd(w);
    const e=new Date(d);e.setDate(d.getDate()+6);
    weekInfo.push({w,start:d,end:e,month:d.getMonth()+1,startStr:fd(d),endStr:fd(e)});
  }

  // 월별 그룹
  const monthGroups=[];
  let cm=null,cc=0;
  weekInfo.forEach(wi=>{
    if(wi.month!==cm){if(cm!==null)monthGroups.push({month:cm,count:cc});cm=wi.month;cc=1;}else cc++;
  });
  if(cm!==null)monthGroups.push({month:cm,count:cc});

  // 분기별 그룹
  const quarterGroups=[];
  let cq=null,qc=0;
  weekInfo.forEach(wi=>{
    const q=Math.ceil(wi.month/3);
    if(q!==cq){if(cq!==null)quarterGroups.push({q:cq,count:qc});cq=q;qc=1;}else qc++;
  });
  if(cq!==null)quarterGroups.push({q:cq,count:qc});

  // 월 경계
  const mbWeeks=new Set();
  let wIdx=1;
  monthGroups.forEach((mg,i)=>{if(i>0)mbWeeks.add(wIdx);wIdx+=mg.count;});

  // 영역별 바 색상 (index.html 동일, 진한 컬러)
  const areaColor={
    '이지원':'#3b82f6','인터넷웹':'#7c3aed','콜센터':'#10b981','인프라':'#f59e0b','PMO':'#64748b'
  };

  // 트리
  const tree=buildWbsTree(curIssues);
  const flatNodes=flattenTree(tree);

  // 툴바
  let h=`<div class="gantt-toolbar">
    <span><span class="gl-sq" style="background:#3b82f6"></span>완료</span>
    <span><span class="gl-sq" style="background:#93c5fd"></span>진행</span>
    <span><span class="gl-sq" style="background:#fbbf24"></span>검토</span>
    <span><span class="gl-sq" style="background:#cbd5e1"></span>대기</span>
    <div class="tsep"></div>
    <span style="background:#fef3c7;padding:1px 6px;border-radius:3px;color:#b45309">오늘 W${todayW||'-'}</span>
    <span style="color:var(--text-muted)">▶ 접기/펼치기</span>
    <span style="margin-left:auto;color:var(--text-muted)">W1=4/2 | ${TW}주 | ${selectedSnapDate}</span>
  </div><table class="gt"><thead>`;

  // Row 1: 분기 (Q2, Q3, Q4)
  h+='<tr><th class="g-hm g-hn" rowspan="2" style="vertical-align:middle;font-size:11px;color:#94a3b8">WBS / 작업명</th>';
  quarterGroups.forEach((qg,qi)=>{
    const bl=qi>0?'border-left:2px solid #475569;':'';
    h+=`<th class="g-hm" colspan="${qg.count}" style="${bl}font-size:11px;color:#94a3b8;font-weight:400">Q${qg.q}</th>`;
  });
  h+='</tr>';

  // Row 2: 월
  h+='<tr>';
  monthGroups.forEach((mg,mi)=>{
    const bl=mi>0?'border-left:2px solid #475569;':'';
    h+=`<th class="g-hm" colspan="${mg.count}" style="${bl}">${mg.month}월</th>`;
  });
  h+='</tr>';

  // Row 3: 주차 (W1~W30)
  h+='<tr><th class="g-hw g-hn">　</th>';
  for(let w=1;w<=TW;w++){
    const wk=weekInfo[w-1];
    const isTd=w===todayW;
    const isPast=w<todayW;
    const isMb=mbWeeks.has(w);
    const cls=['g-hw','g-w',isTd?'g-hw-now':'',isPast?'g-hw-past':'',isMb?'g-month-start':''].filter(Boolean).join(' ');
    h+=`<th class="${cls}" title="W${w}: ${wk.startStr}~${wk.endStr}"><div>W${w}</div><div class="g-hw-dt">${wk.startStr}</div></th>`;
  }
  h+='</tr></thead><tbody>';

  // 각 노드
  flatNodes.forEach(node=>{
    const i=node.issue;
    const code=node.code;
    const depth=node.depth;
    const hasChildren=node.hasChildren;
    const phaseIdx=code.split('.')[0];
    const phaseColor=(PM[phaseIdx]||{c:'#64748b'}).c;
    // 영역 색상 결정
    const ac=areaColor[area(i)]||'#94a3b8';

    const ancestors=[];
    const parts=code.split('.');
    for(let d=1;d<parts.length;d++) ancestors.push(parts.slice(0,d).join('.'));
    const ancestorAttr=ancestors.length?` data-parents="${ancestors.join(',')}"`:'';

    const treeNode=hasChildren?(function fn(ns,c){for(const n of ns){if(n.code===c)return n;const f=fn(n.children,c);if(f)return f;}return null;})(tree,code):null;
    const range=treeNode?getTreeRange(treeNode):{sw:d2w(i.start_date)||1,ew:d2w(i.due_date)||(d2w(i.start_date)||1)};
    const stats=treeNode?getTreeStats(treeNode):{total:1,done:i.status_wbs==='done'?1:0,doing:0};
    const pct=stats.total?(stats.done/stats.total*100).toFixed(0):0;

    const lvCls=`g-lv${Math.min(depth,3)}`;
    const toggle=hasChildren?`<span class="g-toggle" data-code="${code}" onclick="toggleGantt(event,'${code}')">▼</span>`:'';
    const statusBadge=badge(i.status_wbs);
    const indent=depth>=2?`<span class="g-indent">└</span>`:'';

    // 담당자/기간 메타 정보
    const owner=i.assignee||'';
    const sd=i.start_date||'';
    const ed=i.due_date||'';
    const metaHtml=(depth>=2&&(owner||sd))?`<span class="g-meta"><span class="g-owner">${owner}</span> <span class="g-dates">${sd?sd.slice(5):''}~${ed?ed.slice(5):''}</span></span>`:'';

    let nameContent;
    if(depth===0){
      nameContent=`${toggle} <strong>${code} ${i.summary}</strong> <span class="g-p-sub">${stats.total}건 ${pct}%</span>`;
    }else if(depth===1){
      nameContent=`${toggle} ${code} <strong>${i.summary}</strong> ${statusBadge} <span class="g-p-sub">${stats.total>1?stats.total+'건':''}</span>`;
    }else{
      nameContent=`${indent}<span class="g-wbs">${code}</span> ${i.summary} ${statusBadge}${metaHtml}`;
    }

    const rowClick=hasChildren?'':`onclick="showDetail('${i.key}')"`;
    h+=`<tr class="g-tree-row" data-code="${code}" data-depth="${depth}"${ancestorAttr} style="cursor:pointer" ${rowClick}>`;
    h+=`<td class="g-n ${lvCls}">${nameContent}</td>`;

    const sw=range.sw, ew=range.ew;
    const barSpan=ew-sw+1;

    for(let w=1;w<=TW;w++){
      const isTd=w===todayW;
      const isPast=w<todayW;
      const isMb=mbWeeks.has(w);
      const cls=[isTd?'g-col-now':'',isPast&&!isTd?'g-col-past':'',isMb?'g-month-start':''].filter(Boolean).join(' ');

      if(w>=sw&&w<=ew){
        const isS=w===sw, isE=w===ew;
        let radCls=isS&&isE?'g-bar-se':isS?'g-bar-s':isE?'g-bar-e':'';
        let barCls='g-bar';
        let bg;

        if(depth===0){
          barCls='g-bar g-bar-phase';
          bg=phaseColor;
        }else if(depth===1 && hasChildren){
          barCls='g-bar';
          bg=phaseColor;
          barCls+=' g-bar-phase';
        }else{
          bg=ac;
          if(i.status_wbs==='done') radCls+=' g-bar-done';
          else if(i.status_wbs==='doing') radCls+=' g-bar-doing';
          else if(i.status_wbs==='review') radCls+=' g-bar-review';
          else radCls+=' g-bar-todo';
        }

        const showLabel=isS&&barSpan>=2&&depth>=2;
        const labelW=barSpan*52-8;
        let labelHtml='';
        if(showLabel){
          const isTodo=i.status_wbs==='todo';
          const isDone=i.status_wbs==='done';
          const lblCls=isTodo||isDone?'g-bar-label-out':'g-bar-label';
          labelHtml=`<span class="${lblCls}" style="max-width:${labelW}px">${i.summary}</span>`;
        }

        h+=`<td${cls?' class="'+cls+'"':''} style="padding:0;position:relative"><div class="${barCls} ${radCls}" style="background:${bg}">${labelHtml}</div></td>`;
      }else{
        h+=`<td${cls?' class="'+cls+'"':''}></td>`;
      }
    }
    h+='</tr>';
  });

  h+='</tbody></table>';
  wrap.innerHTML=h;
}

// 간트 접기/펼치기
function toggleGantt(ev, code){
  ev.stopPropagation();
  const toggle=ev.target;
  const isCollapsed=toggle.textContent.trim()==='▶';
  toggle.textContent=isCollapsed?'▼':'▶';

  document.querySelectorAll('.g-tree-row').forEach(row=>{
    const parents=(row.dataset.parents||'').split(',');
    if(parents.includes(code)){
      if(isCollapsed){
        row.classList.remove('g-collapsed');
        // 하위 토글 상태도 복원: 부모가 접힌 상태면 여전히 숨김
        const parentCodes=parents.filter(p=>p!==code);
        const anyParentCollapsed=parentCodes.some(pc=>{
          const t=document.querySelector(`.g-toggle[data-code="${pc}"]`);
          return t&&t.textContent.trim()==='▶';
        });
        if(anyParentCollapsed) row.classList.add('g-collapsed');
      }else{
        row.classList.add('g-collapsed');
      }
    }
  });
}

// === Phase Detail ===
function renderPhaseDetail(){
  const c=document.getElementById('phaseDetail');
  let h='';
  Object.entries(PM).forEach(([p,v])=>{
    const pi=curIssues.filter(i=>pn(i)===p).sort((a,b)=>(wbs(a)||'').localeCompare(wbs(b)||''));
    if(!pi.length)return;
    const dn=pi.filter(i=>i.status_wbs==='done').length;
    const dg=pi.filter(i=>i.status_wbs==='doing').length;
    h+=`<div class="tbl-wrap"><div class="section-title"><span style="background:${v.c};width:3px;height:14px;border-radius:2px"></span>${v.n} <span class="section-sub">${pi.length}건 (완료 ${dn}, 진행 ${dg})</span></div>
      <table><thead><tr><th>KEY</th><th>WBS</th><th>제목</th><th>영역</th><th>담당자</th><th>기간</th><th>상태</th></tr></thead>
      <tbody>${pi.map(i=>`<tr style="cursor:pointer" onclick="showDetail('${i.key}')">
        <td><a href="${JB}/browse/${i.key}" target="_blank" style="color:var(--primary);text-decoration:none;font-weight:600">${i.key}</a></td>
        <td style="font-family:monospace;font-size:10px;color:var(--text-muted)">${wbs(i)||''}</td>
        <td>${i.summary}</td><td>${area(i)}</td><td>${i.assignee||'-'}</td>
        <td style="font-size:10px">${i.start_date||'-'} ~ ${i.due_date||'-'}</td><td>${badge(i.status_wbs)}</td>
      </tr>`).join('')}</tbody></table></div>`;
  });
  c.innerHTML=h;
}

// === Tasks ===
function renderTasks(){
  const phF=document.getElementById('taskPhase').value;
  const stF=document.getElementById('taskStatus').value;
  const arF=document.getElementById('taskArea').value;
  const q=(document.getElementById('taskSearch').value||'').toLowerCase();
  popSel('taskPhase',Object.entries(PM).map(([k,v])=>({v:k,l:v.n})));
  popSel('taskStatus',Object.entries(SL).map(([k,v])=>({v:k,l:v})));
  popSel('taskArea',[...new Set(curIssues.map(area))].sort().map(a=>({v:a,l:a})));
  let f=curIssues;
  if(phF)f=f.filter(i=>pn(i)===phF);if(stF)f=f.filter(i=>i.status_wbs===stF);
  if(arF)f=f.filter(i=>area(i)===arF);if(q)f=f.filter(i=>(i.key+i.summary+(i.assignee||'')).toLowerCase().includes(q));
  f.sort((a,b)=>(wbs(a)||'').localeCompare(wbs(b)||''));
  document.getElementById('taskBody').innerHTML=f.map(i=>`<tr style="cursor:pointer" onclick="showDetail('${i.key}')">
    <td><a href="${JB}/browse/${i.key}" target="_blank" style="color:var(--primary);text-decoration:none;font-weight:600">${i.key}</a></td>
    <td style="font-family:monospace;font-size:10px;color:var(--text-muted)">${wbs(i)||''}</td>
    <td>${i.summary}</td><td>${pName(i)}</td><td>${area(i)}</td><td>${i.assignee||'-'}</td>
    <td style="font-size:10px">${i.start_date||'-'}</td><td style="font-size:10px">${i.due_date||'-'}</td>
    <td>${badge(i.status_wbs)}</td><td>${i.priority||'-'}</td></tr>`).join('');
}
function popSel(id,items){const e=document.getElementById(id);if(e.options.length>1)return;items.forEach(i=>{const o=document.createElement('option');o.value=i.v;o.textContent=i.l;e.appendChild(o);});}
['taskPhase','taskStatus','taskArea'].forEach(id=>document.getElementById(id).addEventListener('change',renderTasks));
document.getElementById('taskSearch').addEventListener('input',renderTasks);

// === Modal ===
function showDetail(key){
  const i=curIssues.find(x=>x.key===key)||(allSnapshots[selectedSnapDate]?allSnapshots[selectedSnapDate].issues.find(x=>x.key===key):null);
  if(!i)return;
  document.getElementById('modalTitle').textContent=`${i.key} — ${i.summary}`;
  document.getElementById('modalContent').innerHTML=`<div style="display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;color:var(--text-sub);margin-bottom:14px">
    <strong>WBS</strong><span>${wbs(i)||'-'}</span>
    <strong>페이즈</strong><span>${pName(i)}</span>
    <strong>영역</strong><span>${area(i)}</span>
    <strong>기간</strong><span>${i.start_date||'-'} ~ ${i.due_date||'-'}</span>
    <strong>담당자</strong><span>${i.assignee||'-'}</span>
    <strong>상태</strong><span>${badge(i.status_wbs)}</span>
    <strong>우선순위</strong><span>${i.priority||'-'}</span>
    <strong>유형</strong><span>${i.issue_type||'-'}</span>
    <strong>라벨</strong><span>${(i.labels||[]).join(', ')||'-'}</span>
    <strong>생성</strong><span>${i.created||'-'}</span>
    <strong>수정</strong><span>${i.updated||'-'}</span>
  </div><a href="${JB}/browse/${i.key}" target="_blank" style="color:var(--primary);font-size:12px;font-weight:500">Jira에서 보기 →</a>`;
  document.getElementById('modalOverlay').classList.add('show');
}
// === Drill-down (카드 클릭 시 하단 이슈 목록) ===
function drillDown(filter){
  const wrap=document.getElementById('overviewDrill');
  const SL_FULL={todo:'대기',doing:'진행',review:'검토',done:'완료'};

  // 선택 표시 토글
  document.querySelectorAll('[data-filter]').forEach(el=>el.classList.remove('selected'));
  const sel=document.querySelector(`[data-filter="${filter}"]`);
  if(sel) sel.classList.add('selected');

  // 필터링
  let filtered=curIssues;
  let title='';
  if(filter==='all'){
    title='전체 이슈';
  }else if(filter.startsWith('area:')){
    const aName=filter.split(':')[1];
    filtered=curIssues.filter(i=>area(i)===aName);
    title=`${aName} 영역 이슈`;
  }else{
    filtered=curIssues.filter(i=>i.status_wbs===filter);
    title=`${SL_FULL[filter]||filter} 상태 이슈`;
  }
  filtered.sort((a,b)=>(wbs(a)||'').localeCompare(wbs(b)||'',undefined,{numeric:true}));

  let h=`<div class="tbl-wrap" style="margin-top:16px">
    <div class="drill-header">
      <div class="section-title">${title} <span class="section-sub">(${filtered.length}건)</span></div>
      <button class="drill-close" onclick="closeDrill()">닫기 ✕</button>
    </div>
    <table><thead><tr><th>KEY</th><th>WBS</th><th>제목</th><th>페이즈</th><th>영역</th><th>담당자</th><th>시작일</th><th>종료일</th><th>상태</th></tr></thead>
    <tbody>`;
  filtered.forEach(i=>{
    h+=`<tr style="cursor:pointer" onclick="showDetail('${i.key}')">
      <td><a href="${JB}/browse/${i.key}" target="_blank" style="color:var(--primary);text-decoration:none;font-weight:600">${i.key}</a></td>
      <td style="font-family:monospace;font-size:10px;color:var(--text-muted)">${wbs(i)||''}</td>
      <td>${i.summary}</td>
      <td>${pName(i)}</td>
      <td>${area(i)}</td>
      <td>${i.assignee||'-'}</td>
      <td style="font-size:10px">${i.start_date||'-'}</td>
      <td style="font-size:10px">${i.due_date||'-'}</td>
      <td>${badge(i.status_wbs)}</td>
    </tr>`;
  });
  h+='</tbody></table></div>';
  wrap.innerHTML=h;
  wrap.style.display='block';
  wrap.scrollIntoView({behavior:'smooth',block:'start'});
}
function closeDrill(){
  const wrap=document.getElementById('overviewDrill');
  wrap.style.display='none';
  wrap.innerHTML='';
  document.querySelectorAll('[data-filter]').forEach(el=>el.classList.remove('selected'));
}

function closeModal(){document.getElementById('modalOverlay').classList.remove('show');}
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});

// === 로그인 게이트 ===
const HASH="e20ef9b594a57e2eef2871a1e6e5d53cb8cc74d06afe06b7124b1edc219e5ac0";
async function sha256(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function auth(){
  const v=document.getElementById('pw').value;
  if(!v){setErr('비밀번호를 입력해주세요');return;}
  if(await sha256(v)===HASH){sessionStorage.setItem('wbs_dashboard','1');openMain();}
  else{setErr('비밀번호가 올바르지 않습니다');document.getElementById('pw').value='';document.getElementById('pw').focus();}
}
function setErr(m){const e=document.getElementById('gerr');e.textContent=m;setTimeout(()=>e.textContent='',2500);}
function openMain(){
  document.getElementById('gate').style.display='none';
  document.getElementById('main').style.display='block';
  loadData();
}
if(sessionStorage.getItem('wbs_dashboard')==='1') openMain();
else document.getElementById('pw').focus();
</script>
