name: WBS 비밀번호 해시 업데이트

on:
  workflow_dispatch:   # 수동 실행

permissions:
  contents: write

jobs:
  update-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/implement-wbs-github-6R0N1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔑 비밀번호 해시 계산 및 HTML 업데이트
        env:
          WBS_PASSWORD: ${{ secrets.WBS_PASSWORD }}
        run: |
          HASH=$(echo -n "$WBS_PASSWORD" | sha256sum | cut -d' ' -f1)
          echo "✅ 해시 계산 완료 (비밀번호 노출 없음)"
          # docs/index.html 의 HASH 상수 교체
          sed -i "s/const HASH = \"[a-f0-9]*\"/const HASH = \"$HASH\"/" docs/index.html
          # generate_wbs.py 가 생성할 HTML 도 패치 (향후 실행 대비 기본값 업데이트)
          grep -q "const HASH" docs/index.html && echo "✅ HTML 해시 업데이트 완료" || echo "⚠️ 패턴 미발견"

      - name: 📤 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: WBS 비밀번호 해시 Secret 기반으로 업데이트"
            git push origin claude/implement-wbs-github-6R0N1
            echo "✅ 완료"
          fi
