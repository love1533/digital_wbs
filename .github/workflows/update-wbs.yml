name: JIRA WBS 자동 업데이트

# ─── 실행 트리거 ───────────────────────────────────────────────────────────────
on:
  schedule:
    # 매일 오전 9시 KST (UTC 00:00)
    - cron: "0 0 * * *"
    # 매시간 정각 ← 필요시 아래 주석 해제
    # - cron: "0 * * * *"

  push:
    branches: ["main", "claude/**"]
    paths:
      - "scripts/generate_wbs.py"   # 스크립트 변경 시 자동 재생성

  workflow_dispatch:          # 수동 실행 버튼
    inputs:
      reason:
        description: "실행 이유 (선택)"
        required: false
        default: "수동 실행"

# ─── 권한 ──────────────────────────────────────────────────────────────────────
permissions:
  contents: write

# ─── Job ───────────────────────────────────────────────────────────────────────
jobs:
  update-wbs:
    name: JIRA 데이터 동기화 → HTML 생성
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. 소스 체크아웃 (트리거된 브랜치 기준)
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      # 2. Python 환경
      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      # 3. 의존성 설치
      - name: 📦 의존성 설치
        run: pip install -r scripts/requirements.txt

      # 4. WBS HTML 생성 (JIRA → docs/index.html)
      - name: 🔄 WBS HTML 생성
        env:
          # ── 필수 Secrets ──────────────────────────────
          JIRA_URL:            ${{ secrets.JIRA_URL }}
          JIRA_EMAIL:          ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN:      ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY:    ${{ secrets.JIRA_PROJECT_KEY }}
          WBS_PASSWORD:        ${{ secrets.WBS_PASSWORD }}
          # ── 선택 Variables (Settings → Variables) ────
          WBS_TITLE:           ${{ vars.WBS_TITLE }}
          PROJECT_START_DATE:  ${{ vars.PROJECT_START_DATE }}   # 예: 2026-03-23
          TOTAL_WEEKS:         ${{ vars.TOTAL_WEEKS }}           # 예: 32
          WBS_OUTPUT:          docs/index.html
        run: python scripts/generate_wbs.py

      # 5. 변경 있을 때만 커밋/푸시
      - name: 📤 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # index.html, history.html, 스냅샷 데이터 모두 스테이징
          git add docs/index.html docs/history.html docs/data/
          if git diff --staged --quiet; then
            echo "✅ JIRA 데이터 변경 없음 — 커밋 생략"
          else
            SNAP_DATE=$(date '+%Y-%m-%d')
            CHANGED=$(git diff --staged --stat | tail -1)
            git commit -m "chore: WBS JIRA 동기화 ${SNAP_DATE} [$CHANGED]"
            git push origin HEAD
            echo "✅ HTML + 스냅샷 업데이트 완료"
          fi
